# Per-phase overrides against config_template.yaml (which IS phase 1).
#
# Apply a variant by replacing exactly the keys it lists. Everything else in the
# template is unchanged -- that is the point: one factor moves per phase, so any
# difference is attributable.
#
# PRELIMINARY. Rationale: ../EXPERIMENTS.md section 3.

# NOTE: phase 1-3 all run on dev/rsanchez UNMERGED, via
# controller_report_pool_mode: frozen with each task directory's 12-fact pool
# written into facts/controller_reportable_facts.json. Only phase 4 (episode budget) needs the
# merge. Do NOT use controller_fact_pool_mode: balanced with deterministic
# authoring -- it forces base_score = 0 and makes the fact choice target-blind.

phase_1_report_only_deterministic:
  description: >
    The clean measurement. Reports are the only channel carrying facts and facts
    are the whole treatment; deterministic authoring keeps a language model out
    of the controller loop so the dose is a known function of the sensed state.
    Under report_only the controller's only permitted message type is REPORT, so
    deterministic authoring is genuinely deterministic.
  derived_controller_policy: contextual_weighted_v1
  overrides: {}                       # this is the template as written
  requires_merge: false
  target_alignment_comes_from: >
    task.controller_fact_scores, which drives -base_score in the ranking key. One
    score field per task, so it cannot encode two opposite targets: either use two
    task directories per setup differing only in that field, or accept target-blind
    fact choice where the arms differ only in the recommendation text.

phase_2_report_only_llm:
  description: >
    Adds the language-model controller, changing exactly one thing. Phase 1 is
    the reference it has to be scored against.
  derived_controller_policy: llm_authored_fixed_report_only_v1
  requires_merge: false
  target_alignment_comes_from: >
    the model, which is told the target and picks from the ranked eligible set, so
    target-blind scores are fine here.
  overrides:
    game.options.board.communication_profile: report_only    # unchanged
    control.options.controller_authoring: llm_authored
  reuses_silent_arm_from: phase_1_report_only_deterministic
  note: >
    No new silent runs. Nothing about the agents changed and a silent run has no
    controller, so the phase-1 baselines apply unchanged.

phase_3_full_communication_llm:
  description: >
    Adds the second agent channel. A REQUEST carries no fact, so it adds a
    degree of freedom the measured quantity is blind to; plan the post-meeting plan also puts
    full communication after report-only in its priority list.
  derived_controller_policy: llm_authored_full_communication_v1
  overrides:
    game.options.board.communication_profile: full_communication
    control.options.controller_authoring: llm_authored
  reuses_silent_arm_from: null
  note: >
    Needs its own silent runs, because the agents' communication profile
    changed. The controller picks ONE mode per round (REPORT, REQUEST or
    DIRECTIVE) and fills every slot with it. Do not set
    board.allow_participant_requests -- it is locked to communication_profile.

phase_3b_full_communication_llm_mixed:
  description: >
    Optional refinement of phase 3: a different message type per slot rather
    than one per round.
  derived_controller_policy: llm_authored_mixed_full_communication_v1
  overrides:
    game.options.board.communication_profile: full_communication
    control.options.controller_authoring: llm_authored
    control.options.controller_allow_mixed_message_types: true
  note: >
    controller_allow_mixed_message_types requires llm_authored authoring.

phase_4_full_communication_deterministic:
  description: >
    SKIP unless specifically asked for. Legal, but worse than it looks.
  derived_controller_policy: contextual_weighted_v1
  overrides:
    game.options.board.communication_profile: full_communication
    control.options.controller_authoring: deterministic
  why_skipped: >
    With three permitted message types the deterministic chooser
    (choose_communication_mode in adaptive_communication.py) makes a SEEDED
    RANDOM DRAW among them with context-dependent weights. So "deterministic"
    here means no language model, not no randomness, and it introduces an
    unmotivated stochastic mode choice. Under report_only this never arises
    because the allowed set is just (REPORT,) and the draw is trivial. If the
    aim is a clean dose, use report_only; if the aim is to study communication
    choice, use llm_authored, where the choice is part of the policy under study.

# ---------------------------------------------------------------------------
# The factor grid within every phase
# ---------------------------------------------------------------------------
grid:
  setup:
    - task003_symmetric             # population CAN prove the truth; two pools, so
                                    # task_id task003_symmetric_to_a0 for silent and
                                    # truth control, task003_symmetric_to_a2 for false control
    - task003_nosolution            # population CANNOT; posterior is a coin flip; one pool
  arm:
    - "silent"                      # omit the whole `control:` block
    - "truth_control"               # control.options.target: ALLOCATION_0
    - "false_control"               # control.options.target: ALLOCATION_2
  epistemic_persistence: [0.75, 1.0]

cells_per_phase:
  silent: 4                         # 2 setups x 2 persistence
  controlled: 8                     # 2 setups x 2 directions x 2 persistence
  total_if_silent_needed: 12
  total_if_silent_reused: 8

# ---------------------------------------------------------------------------
# Factors to add later, ONE AT A TIME, after phase 1 is analysed
# ---------------------------------------------------------------------------
later_factors:
  budget_level:
    control.options.intervention_budget: [3, 6]      # the post-meeting plan's b
  budget_scope:
    control.options.controller_budget_scope: episode
    control.options.intervention_budget: [90, 180]   # the post-meeting plan's B
    matched_pairs:
      - {per_round: 3, episode: 90}    # 30 rounds x 3 = 90: identical total capacity
      - {per_round: 6, episode: 180}   # 30 rounds x 6 = 180
    why_worth_running: >
      The matched pair holds TOTAL capacity fixed and varies only whether the
      controller may choose its own timing, which is a clean contrast and is
      the post-meeting plan's own design. With a reservoir, temporal allocation becomes part of
      the controller policy -- the richer object.
    required_before_trusting_path_quantities: >
      Augment the coarse-grained state with a 3-level remaining-budget
      coordinate and re-run the four Markov tests on the augmented chain
      (../coarse_graining/, ../coarse_graining/code/four_tests.py). The remaining
      budget only ever decreases, so it carries the whole intervention history
      and is strongly non-Markov if left out of the state.
    note: >
      An episode reservoir makes the remaining budget a hidden state variable, a
      second memory channel on top of the one the coarse-graining already fails
      to capture at rho = 0.75. Also requires
      controller_report_max_posts_per_fact >= the budget, and only works because
      darius relaxed the pool-size bound for episode scope.
  controller_sensing:
    control.options.sensor_sample_size: [23, "<partial, undefined>"]
    note: the post-meeting plan asks for a partial-board sensing arm but never defines it.
  agent_board_reading:
    game.options.board.sampling: [full, uniform]
    note: >
      uniform samples social_group_size messages instead of the whole board,
      adding a per-round reading lottery on top of epistemic decay.
