# Simulation 1 -- days and nights, per-round controller budget.
# Every rule is defined in simulation_1_spec.md. Agreed 6 October 2026; not yet implemented.
#
# HOW TO READ THIS FILE
#   grid:   each list is a factor; the study runs every combination of them
#           (with the exception under `cells`).
#   fixed:  one value each, the same in every cell.
# Nothing outside these two blocks changes between cells.

study: simulation_1_first_grid

grid:
  setup:  [task003_symmetric, task003_nosolution]
  arm:    [silent, truth, false]   # silent = no controller; truth targets ALLOCATION_0;
                                   # false targets ALLOCATION_2
  q:      [3, 6, 12]               # posts an agent reads per day
  qc:     [12, 24]                 # posts the controller reads per night
  b:      [1, 2, 3]                # facts the controller posts when it acts
  rho:    [0.75, 1.0]              # chance an active fact survives each dawn

cells:
  # qc and b mean nothing without a controller, so the silent arm is NOT
  # crossed with them:
  #   silent:  2 setups x 3 q x 2 rho                           =  12
  #   truth:   2 setups x 3 q x 2 qc x 3 b x 2 rho              =  72
  #   false:   2 setups x 3 q x 2 qc x 3 b x 2 rho              =  72
  #   total                                                     = 156 cells
  silent_ignores: [qc, b]
  expected_total: 156            # the runner refuses to start if it counts otherwise
  episodes_per_cell: 1000        # 156,000 episodes in all

fixed:
  # --- episode ---
  M: 30                          # rounds (day + night) per episode
  population_size: 24            # from the setup's agents.json, one fact each

  # --- board ---
  is_board_cleared: true         # each night keep only the controller's new posts.
                                 # false is a LATER study, not part of this grid
  board_read_weighting: uniform  # only used when is_board_cleared is false
  read_posts_not_facts: true     # a fact posted 3 times is 3x as likely to be read

  # --- agents ---
  agent_sampling_mode: argmax    # argmax | probability_matching | softmax
  beta: 4                        # only used by softmax
  agent_post_always: false       # true: post a random active fact when none
                                 # supports the vote
  support_rule: in_context       # removing the fact lowers P(vote)
  support_fallback: read_alone   # if no fact supports the vote in context (redundant
                                 # proofs, spec section 10), use P(vote | fact alone) > 1/3
  prefer_facts_not_read_today: true
  supporting_fact_choice: uniform

  # --- controller ---
  controller_gate: votes         # votes | facts | always
  theta_vote: 0.75               # votes gate: silent if this share of read posts
                                 # already vote for the target
  theta_facts: 0.8               # only used by the facts gate
  silent_when_target_proved: true
  fallback_when_target_ruled_out: strongest_set_alone
  controller_reads_own_posts: false
  controller_memory: none        # none | accumulate (later experiments)
  posts_all_or_nothing: true     # posts exactly b facts, or none

  # --- randomness ---
  paired_random_streams: true    # the 3 arms of an episode share their draws
  seed: 2026

output:
  directory: results/simulation_1/   # inside analysis/task003_llm_free/, not in git
  per_agent_per_day: true
  per_night: true
  per_episode: true
