# Written 20 October 2026: key-phenomena study, step 3 (Campaign B). What carries the persistence of the false
# controller's effect after it stops (t = 30)? Four post-stop modes (simulator setting post_stop_mode), each with its
# own silent arm, in the two regimes found in step 1: rho 0.25 (no relaxation) and 0.75 (partial relaxation).
# Runs to t = 130. Every mode is identical to normal up to t = 30 (keyed random streams; tested). The normal cells
# must reproduce the fine runs exactly for t <= 40.
# Plan: simulation_2/key_phenomena_hypothesis/02_reanalysis_existing_data.md, section 8.

study: sim2_persistence_branches
description: "persistence branches: both setups, rho 0.25/0.75, q 6, rate 1, qc 12, gate on; post-stop modes normal/no_comm/frozen_board/purge; t_end 130"

paths:
  world_file: ../../../llmfree_core/world_task003.json
  setups_dir: ../../../experimental_setup
  results_dir: ../../../results/simulation_2

grid:
  setup:    [task003_symmetric, task003_nosolution]
  arm:      ["silent", "false"]
  q:        [6]
  qc:       [12]
  rho:      [0.75, 0.25]
  lambda_c: [1.0]
  controller_gate: ["votes"]
  silent_when_target_proved: [true]
  post_stop_mode: ["normal", "no_comm", "frozen_board", "purge_controller_facts"]

fixed:
  board: persistent
  forgetting: continuous
  agent_schedule: poisson
  controller_schedule: poisson
  lambda_a: 1.0
  theta_vote: 0.75
  W: 48
  budget: 30
  t_control: 30.0
  t_end: 130.0
  grid_step: 0.25
  agent_sampling_mode: probability_matching
  prefer_facts_not_read: true
  seed: 20261007

cells:
  episodes_per_cell: 1000
  dedupe_irrelevant_proof_stop: true
  # 2 setups x 2 rho x 4 modes x 2 arms = 32
  expected_total: 32

record:
  agent_snapshots: true
  tables: [snapshots, controller, episodes, posts, agent_snapshots]
