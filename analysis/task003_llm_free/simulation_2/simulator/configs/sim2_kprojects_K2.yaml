# Written 22 October 2026: key-phenomena study, fact scaling (finite_size/). K = 2 independent task_003-type projects with
# one split (llmfree_core/kworld.py; setups built by key_phenomena_hypothesis/finite_size/build_k_setups.py):
# N = 48 agents and 2 x the facts, so copies per fact stay as at K = 1. Board window, controller rate and budget
# scaled by K (plan section 7): W = 96, lambda_c = 2, B = 60; q and q_c unchanged. Compare with the K = 1 fine runs.

study: sim2_kprojects_K2
description: "K = 2 projects, one split: both setups, rho 1/0.75/0.5/0.25, q 3/6, false and silent, qc 12, gate on; W 96, rate 2, budget 60; light record"

paths:
  world_file: ../../../llmfree_core/world_task003_K2.json
  setups_dir: ../../../experimental_setup
  results_dir: ../../../results/simulation_2

grid:
  setup:    [task003_symmetric_K2, task003_nosolution_K2]
  arm:      ["silent", "false"]
  q:        [3, 6]
  qc:       [12]
  rho:      [1.0, 0.75, 0.5, 0.25]
  lambda_c: [2.0]
  controller_gate: ["votes"]
  silent_when_target_proved: [true]

fixed:
  board: persistent
  forgetting: continuous
  agent_schedule: poisson
  controller_schedule: poisson
  lambda_a: 1.0
  theta_vote: 0.75
  W: 96
  budget: 60
  t_control: 30.0
  t_end: 40.0
  grid_step: 0.25
  agent_sampling_mode: probability_matching
  prefer_facts_not_read: true
  seed: 20261007

cells:
  episodes_per_cell: 1000
  dedupe_irrelevant_proof_stop: true
  # silent: 2 setups x 2 q x 4 rho = 16; false: 16; total 32
  expected_total: 32

record:
  agent_snapshots: false
  tables: [snapshots, controller, episodes]
