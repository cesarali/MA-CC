# Simulation 2, exploratory confirmation run: sim2_grid's task003-nosolution cells with full memory (rho 1),
# where a higher rate gave a lower gain (analysis 2026-10-09). Seed 2027. Otherwise identical to sim2_grid.yaml.
# Every rule is defined in ../simulation_2_spec.md. Written 9 October 2026.
#
# HOW TO READ THIS FILE
#   grid:   each list is a factor; the study runs every combination of them, except that
#           silent cells leave out the controller factors (qc, lambda_c, gate, proof stop).
#   fixed:  one value each, the same in every cell. These are the core settings: agents and
#           controller act at random times, memory fades continuously, the board fades
#           (readers sample the 48 most recent posts). One fact per controller message (b = 1).
#   The proof stop can matter only for task003-symmetric, truth arm; elsewhere its two values
#   are the same simulation, run once (cells.dedupe_irrelevant_proof_stop).
# Nothing outside these blocks changes between cells.

study: sim2_rho1_confirm_seed2027
description: "exploratory confirmation: nosolution, rho 1, q 3/6/12, qc 6/12, every rate, gate on/off, seed 2027"

paths:                                    # relative to this file
  world_file: ../../../llmfree_core/world_task003.json
  setups_dir: ../../../experimental_setup
  results_dir: ../../../results/simulation_2   # the run goes to results/simulation_2/<date>_<study>/

grid:
  setup:    [task003_nosolution]
  arm:      ["silent", "truth", "false"]  # QUOTED: unquoted, YAML reads false as the boolean False
  q:        [3, 6, 12]                    # posts an agent reads per action
  qc:       [6, 12]                       # agent posts the controller reads per action
  rho:      [1.0]                         # survival of a fact over one time unit
  lambda_c: [0.5, 1.0, 2.0, 4.0, 8.0]     # controller actions per time unit (replaces Simulation 1's b)
  controller_gate: ["votes", "always"]    # votes: silent when v_hat >= theta_vote; always: no gate
  silent_when_target_proved: [true]       # cannot act in nosolution

fixed:
  board: persistent
  forgetting: continuous
  agent_schedule: poisson
  controller_schedule: poisson
  lambda_a: 1.0                           # agent actions per time unit
  theta_vote: 0.75
  W: 48                                   # readers sample from the 48 most recent eligible posts
  budget: 30                              # controller messages per episode, one fact each
  t_control: 30.0                         # the controller may act for t < 30
  t_end: 40.0                             # follow-up without controller from 30 to 40
  grid_step: 0.25                         # measurement times 0, 0.25, ..., 40
  agent_sampling_mode: probability_matching
  prefer_facts_not_read: true
  seed: 2027

cells:
  episodes_per_cell: 1000
  dedupe_irrelevant_proof_stop: true
  # silent: 3 q; controlled: 2 targets x 3 q x 2 qc x 5 rates x 2 gates = 120
  expected_total: 123

record:
  agent_snapshots: true
  full_tables_where: {q: 6, qc: 12, rho: 0.75}   # every table here; elsewhere posts, controller, snapshots, episodes
