# Written 20 October 2026: key-phenomena study, step 2 (Campaign A). The reading reversal's mechanism: what agents
# remember and what the board carries, against q, at all 8 memories, both setups, false controller and silent arm.
# Same rules and seed as the fine runs, so the q = 3, 6, 12 cells must reproduce them exactly (light tables);
# q = 9 is new. Records each agent's memory every 0.25 (agent_snapshots) and every board post.
# Plan: simulation_2/key_phenomena_hypothesis/02_reanalysis_existing_data.md, section 8.

study: sim2_reading_mechanism
description: "reading mechanism: both setups, rho 8 values, q 3/6/9/12, false and silent, rate 1, qc 12, gate on; memories and posts recorded"

paths:                                    # relative to this file
  world_file: ../../../llmfree_core/world_task003.json
  setups_dir: ../../../experimental_setup
  results_dir: ../../../results/simulation_2

grid:
  setup:    [task003_symmetric, task003_nosolution]
  arm:      ["silent", "false"]           # QUOTED: unquoted, YAML reads false as the boolean False
  q:        [3, 6, 9, 12]
  qc:       [12]
  rho:      [1.0, 0.875, 0.75, 0.625, 0.5, 0.375, 0.25, 0.125]
  lambda_c: [1.0]
  controller_gate: ["votes"]
  silent_when_target_proved: [true]

fixed:
  board: persistent
  forgetting: continuous
  agent_schedule: poisson
  controller_schedule: poisson
  lambda_a: 1.0
  theta_vote: 0.75
  W: 48
  budget: 30
  t_control: 30.0
  t_end: 40.0
  grid_step: 0.25
  agent_sampling_mode: probability_matching
  prefer_facts_not_read: true
  seed: 20261007

cells:
  episodes_per_cell: 1000
  dedupe_irrelevant_proof_stop: true
  # silent: 2 setups x 4 q x 8 rho = 64; false: 2 x 4 x 8 = 64; total 128
  expected_total: 128

record:
  agent_snapshots: true
  tables: [snapshots, controller, episodes, posts, agent_snapshots]
