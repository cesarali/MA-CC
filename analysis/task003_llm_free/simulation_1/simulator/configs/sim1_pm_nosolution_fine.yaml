# Written 16 October 2026: the grid of sim1_pm_symmetric_fine.yaml for task003-nosolution, with the 8-value rho scan.
# Seed 2026 as before, so cells shared with sim1_pm (2026-10-07) must reproduce it exactly.
#

study: sim1_pm_nosolution_fine
description: "nosolution, probability matching: b 1-9, rho 1 to 0.125 in 8 steps, gate on/off; light record"

paths:                                    # relative to this file
  world_file: ../../../llmfree_core/world_task003.json
  setups_dir: ../../../experimental_setup
  results_dir: ../../../results/simulation_1   # the run goes to results/simulation_1/<date>_<study>/

grid:
  setup:  [task003_nosolution]
  arm:    ["silent", "truth", "false"]    # QUOTED: unquoted, YAML reads false as the boolean False
  q:      [3, 6, 12]                      # posts an agent reads per day
  qc:     [3, 6, 12, 24]                  # posts the controller reads per night
  b:      [1, 2, 3, 4, 5, 6, 7, 8, 9]     # facts the controller posts per night (at most 12, the pool)
  rho:    [1.0, 0.875, 0.75, 0.625, 0.5, 0.375, 0.25, 0.125]          # chance an active fact survives each dawn
  controller_gate: ["votes", "always"]    # votes: gate on (silent at v_hat >= 0.75); always: gate off
cells:
  silent_ignores: [qc, b]                 #   silent:  3 q x 8 rho = 24; truth and false: 3 q x 4 qc x 9 b x 8 rho x 2 gates = 1,728 each; total 3,480
  expected_total: 3480
  episodes_per_cell: 1000
fixed:
  # --- episode ---
  M: 30                                   # days per episode
  controller_acts_on_final_night: false   # NEW: after day 30 nothing can read its posts

  # --- board ---
  is_board_cleared: true
  board_read_weighting: uniform           # only used when is_board_cleared is false
  read_posts_not_facts: true

  # --- agents: voting ---
  agent_sampling_mode: probability_matching   # CHANGED. argmax | probability_matching | softmax
  beta: 4                                 # only used by softmax

  # --- agents: posting ---
  agent_post_rule: supporting             # NEW: supporting | uniform_active
  agent_post_always: false                # supporting rule only: if no fact supports the
                                          # vote, post a random active fact instead of abstaining
  support_rule: in_context
  support_fallback: read_alone
  prefer_facts_not_read_today: true
  supporting_fact_choice: uniform

  # --- controller ---
  theta_vote: 0.75                        # effective threshold depends on qc: see the spec
  theta_facts: 0.8
  silent_when_target_proved: true         # step 2 sets this to false
  fallback_when_target_ruled_out: strongest_set_alone
  controller_reads_own_posts: false
  controller_memory: none
  posts_all_or_nothing: true

  # --- randomness ---
  paired_random_streams: true
  seed: 2026

record:
  agent_days: false                       # LIGHT: no per-agent table; days.parquet keeps vote shares,
                                          # mean beliefs and proof rates per episode and day
  posts_read: false
  memory_after_dawn: true
  post_reason: true
  nights: true
  proof_two_ways: true
