# Written 29 October 2026: the clean 15-agent campaign, Object Placements (pre-registration: ../00_preregistration.md).
# Reading reversal and persistence, false controller against its paired silent arm; standard against deduplicated
# reading. rho is spaced evenly in mean memory lifetime tau = -1/ln(rho) (tau = 0.25 ... 16, infinity); q on a log
# scale. Controller: rate 1, q_c 8, budget 30, vote gate, proof stop. Runs to t = 130 (controller stops at 30).

study: sim2_15agents_op
description: "15-agent campaign, Object Placements: symmetric and uniform no-solution; false and silent; q 1..16 x 8 rho (memory-lifetime grid) x read posts/distinct_facts; W 30, qc 8, rate 1; t_end 130"

paths:
  world_file: ../../object_placements_llm_free/world/world_op1.json
  setups_dir: ..
  results_dir: ../results

grid:
  setup:    [op_symmetric_15, op_nosolution_uniform_15]
  arm:      ["silent", "false"]
  q:        [1, 2, 3, 4, 6, 8, 12, 16]
  qc:       [8]
  rho:      [0.018, 0.135, 0.37, 0.61, 0.78, 0.88, 0.94, 1.0]
  lambda_c: [1.0]
  controller_gate: ["votes"]
  silent_when_target_proved: [true]
  read_mode: ["posts", "distinct_facts"]

fixed:
  board: persistent
  forgetting: continuous
  agent_schedule: poisson
  controller_schedule: poisson
  lambda_a: 1.0
  theta_vote: 0.75
  W: 30
  budget: 30
  t_control: 30.0
  t_end: 130.0
  grid_step: 0.25
  agent_sampling_mode: probability_matching
  prefer_facts_not_read: true
  seed: 20261029

cells:
  episodes_per_cell: 1000
  dedupe_irrelevant_proof_stop: true
  # 2 setups x 8 q x 8 rho x 2 reading modes x 2 arms = 512
  expected_total: 512

record:
  agent_snapshots: true
  # each agent's memory and last vote only at these times (the full 0.25 grid would be ~8 million rows per cell)
  agent_snapshot_times: [10.0, 20.0, 30.0, 31.0, 35.0, 40.0, 60.0, 80.0, 100.0, 130.0]
  tables: [snapshots, controller, episodes, posts, agent_snapshots]
