[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-naming-game"
version = "0.1.0"
description = "Sequential and synchronous LLM Naming Game benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
naming-game = "naming_game.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
