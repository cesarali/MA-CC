[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-naming-game"
version = "0.1.0"
description = "Sequential and synchronous LLM Naming Game benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "numpy>=2.0",
  "torch>=2.2",
  "sentence-transformers>=3.0",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "matplotlib>=3.9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
comet = ["comet_ml>=3.58,<4"]
gemma4 = [
  "accelerate>=1.0",
  "huggingface-hub>=0.30",
  "safetensors>=0.4",
  "transformers>=5.5",
  "torchvision",
]

[project.scripts]
naming-game = "naming_game.cli:main"
mas-cc = "mas_cc.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
