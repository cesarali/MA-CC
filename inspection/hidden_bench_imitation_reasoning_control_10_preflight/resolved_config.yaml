schema_version: 1
llm_provider:
  schema_version: 1
  type: university
  model: microsoft/gpt-5.4-nano
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 60.0
  max_retries: 2
  request_concurrency: 10
  temperature: 0.0
  max_output_tokens: 128
  options:
    estimated_latency_seconds: 3.0
prompt:
  schema_version: 2
  prompt_family: hidden_bench_imitation_update
  prompt_version: 1
  response_contract:
    type: hidden_bench_json_vote
    allowed_values:
    - West City
    - East Town
    - North Hill
  message_mode: null
  block_separator: null
  options: {}
  resolved_block_manifest:
  - order: 1
    name: scenario
    version: 1
    role: system
    required: true
    binding: dynamic
    sensitive: false
  - order: 2
    name: information
    version: 1
    role: system
    required: true
    binding: dynamic
    sensitive: true
  - order: 3
    name: response_style
    version: 1
    role: system
    required: true
    binding: dynamic
    sensitive: false
  - order: 4
    name: private_history
    version: 1
    role: system
    required: false
    binding: dynamic
    sensitive: true
  - order: 5
    name: interaction
    version: 1
    role: user
    required: true
    binding: dynamic
    sensitive: true
  definition_hash: 49e2ccc7bf7f3a4b4c661295ecbb775627740144e14b8d5a8529bfbcfa81d361
game:
  schema_version: 1
  type: hidden_bench_imitation
  population_size: 4
  horizon: 100
  topology: complete
  options:
    task_set: vanilla
    task_id: evacuation_north_hill
    profile: hidden
    assignment_scheme: bijective
    dynamics_mode: reasoning
    pairing: uniform_two_distinct
    messages_per_agent: 1
    memory_size: 0
    allow_relay: true
    stop_on_consensus: false
    initialization:
      mode: explicit
      initial_votes:
      - East Town
      - East Town
      - North Hill
      - West City
    classical:
      kernel: irisarri_multi_opinion
      forward_rate: 1.0
      reverse_rate: 1.0
      interaction_factor: destination_count_plus_offset
      interaction_offset: 1.0
      control_strength: 2.0
execution:
  schema_version: 1
  seed: 20260840
  repetitions: 5
  parallelism: 5
  fail_fast: false
  timeout_seconds: null
logging:
  schema_version: 1
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    show_metrics: true
    prompt_examples:
      count: 20
storage:
  schema_version: 1
  output_dir: results
  format: jsonl
  checkpoints: true
  overwrite: false
  options: {}
analysis:
  schema_version: 1
  enabled: true
  estimators:
  - sensing_mi
  - population_actuation_cmi
  - target_actuation_cmi
  - focal_actuation_cmi
  options:
    bootstrap_resamples: 1000
    null_permutations: 1000
    confidence: 0.95
    seed: 20260813
control:
  schema_version: 1
  mechanism: threshold_target
  options:
    target: correct
    sensor_sample_size: 2
    policy: threshold_target
    threshold: 0.5
metrics:
  schema_version: 1
  enabled: true
  comet_export: []
  available: {}
  bin_size_interactions: null
  partial_final_bin: drop
  exclude_committed_outputs: false
aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles:
  - 10
  - 50
  - 90
  rolling_window: 1
  cell_metrics:
  - m_ctrl
  - m_truth
  - m_order
  - population_action_share_per_option
  - dominant_action_share
  sweep_metrics: []
  horizons:
  - 1
  null_permutations: 0
observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20.0
    grid_image_every_n_episodes: 25
    sweep_experiment: true
    cell_experiments: true
    progress_metrics:
    - episodes_done
experiment:
  schema_version: 1
  name: hidden-bench-imitation-reasoning-control-gpt54nano
  description: Five controlled reasoning episodes using GPT-5.4 Nano with event and
    pooled response diagnostics.
  tags:
  - hidden-bench
  - imitation
  - reasoning
  - control
  - diagnostics
  - gpt-5.4-nano
  metadata: {}
pricing:
  schema_version: 1
  mode: live
  cache_path: null
  max_age_seconds: 600.0
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  schema_version: 1
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 50.0
  max_cost_per_run: 50.0
  max_provider_requests: 2500
  max_input_tokens: 10000000
  max_output_tokens: 500000
  allow_unbounded_paid_requests: false
