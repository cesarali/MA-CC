schema_version: 1
llm_provider:
  schema_version: 1
  type: university
  model: gwdg/qwen3-30b-a3b-instruct-2507
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 60.0
  max_retries: 2
  request_concurrency: 2
  temperature: 0.0
  max_output_tokens: 64
  options:
    estimated_latency_seconds: 3.0
prompt:
  schema_version: 1
  prompt_family: basic_binary_choice
  prompt_version: 1
  blocks:
  - task_description
  - game_rules
  - private_state
  - recent_memory
  - current_interaction
  - decision_instruction
  - output_contract
  response_contract:
    type: choice_only
    allowed_values:
    - A
    - B
  options: {}
game:
  schema_version: 1
  type: toy_coordination
  population_size: 2
  horizon: 3
  topology: complete
  options:
    actions:
    - A
    - B
execution:
  schema_version: 1
  seed: 1026
  repetitions: 1
  parallelism: 1
  fail_fast: true
  timeout_seconds: null
logging:
  schema_version: 1
  level: INFO
  console: true
  audit: true
  comet: false
  options: {}
storage:
  schema_version: 1
  output_dir: results
  format: jsonl
  checkpoints: true
  overwrite: false
  options: {}
analysis:
  schema_version: 1
  enabled: false
  estimators: []
  options: {}
experiment:
  schema_version: 1
  name: provider-smoke-test
  description: Static Phase 2 configuration validation; no provider call is made.
  tags:
  - smoke
  - phase-02
  metadata: {}
pricing:
  schema_version: 1
  mode: live
  cache_path: inspection/phase_04_amendment/pricing_snapshot.json
  max_age_seconds: 900.0
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  schema_version: 1
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 1.0
  max_cost_per_run: 0.5
  max_provider_requests: 10
  max_input_tokens: 10000
  max_output_tokens: 1000
  allow_unbounded_paid_requests: false
