# Opt-in GPU smoke game: one neutral episode, three agents, three rounds.
population_size: 3
names: [A, B]
memory_length: 3
max_population_rounds: 3
committee_sizes: [0]
pulse_rounds: [1]
regimes: [neutral]

replications:
  unit: per_stratum
  count: 1

auto_analyze: false
quick_bootstrap_resamples: 0
quick_null_permutations: 0

temperature: 0.0
max_tokens: 1
seed: 7
window_interactions: 9
resolution_threshold: 0.95

provider: gemma_local
model: google/gemma-4-12B-it
fallback_provider: openai
allow_fallback: false
require_live_provider: true
request_concurrency: 1
episode_concurrency: 1
timeout_seconds: 120
max_retries: 0

decision_output_format: choice_only
choice_selection_policy: argmax
choice_temperature: 1.0

logging:
  enabled: true
  level: INFO
  api_status_log: true
  audit_traces:
    enabled: true
    inspect_every_percent: 1
    examples_per_selected_round: 1
    seed: 7
    include_request: true
    include_raw_response: true
    include_parsed_response: true
    include_agent_memory: true

