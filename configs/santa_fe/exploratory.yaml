experiment:
  episodes: 20
  processes: 2
  seed: 20260925
output:
  results_dir: results/santa_fe_exploratory
  save_round_trajectories: true
  save_micro_trajectories: false
  save_plots: true
  save_reports: true
model:
  N: 24
  F: 10
  q: 3
  rounds: 30
  initial_fact_redundancy: 3
  truth_fact_fraction: 0.70
  rho: 0.75
  beta_evidence: 2.0
  beta_social: 1.0
  sensing_fraction: 0.50
  controller_target: -1
  policy_beta: 8.0
  policy_threshold: 0.50
  budget_fraction: 0.125
sweep:
  beta_evidence: [2.0]
  beta_social: [1.0]
  budget_fraction: [0.0, 0.125, 0.25]
analysis:
  bins: 6
  epistemic_coordinate: mean_coverage
  mutual_information: {enabled: false}
  permutation_null: {enabled: false, n_permutations: 1000, seed: 42, preserve_conditioning_state: true}
  bootstrap: {enabled: false, n_bootstrap: 1000, unit: episode, confidence_level: 0.95}
  llm_parallel:
    processes: 2
    bootstrap_resamples: 100
    null_permutations: 100
    confidence: 0.95
    seed: 20260925
    statistics:
      - round_sensing_mi
      - round_target_sensing_mi
      - round_sensor_action_mi
      - round_population_actuation_cmi
      - round_target_actuation_cmi
      - round_truth_actuation_cmi
      - round_kappa_target_actuation_cmi
      - round_epistemic_target_actuation_cmi
  histograms: {enabled: false, save_null_histograms: false}
sample_size_study:
  enabled: false
  episode_counts: [10, 20, 30, 50, 75, 100]
  repetitions: 200
