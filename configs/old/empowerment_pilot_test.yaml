# Minimal live OpenAI end-to-end smoke test.
#
# This produces exactly one episode:
# - 5 agents
# - 5 population rounds = 25 pair interactions
# - 1 committee member
# - neutral start
# - always_A committee policy
#
# This file deliberately requires a live provider. The CLI rejects --mock so
# the episode cannot silently use synthetic responses.
population_size: 5
names: [A, B]
memory_length: 5
max_population_rounds: 5
committee_sizes: [1]
regimes: [neutral]

# `per_stratum: 1` selects the first neutral policy (`always_A`) once,
# resulting in exactly one episode rather than one episode per policy.
replications:
  unit: per_stratum
  count: 1

auto_analyze: true
quick_bootstrap_resamples: 2
quick_null_permutations: 1
convention_roles:
  strong_name: A
  weak_name: B
  source: calibration

temperature: 0.5
max_tokens: 1000
seed: 1

# Three times the population size. Events cannot trigger before this full
# 15-interaction rolling window is available.
window_interactions: 15
resolution_threshold: 0.95

# Use the official OpenAI API with no provider fallback.
provider: openai
model: gpt-4o-mini
fallback_provider: openai
allow_fallback: false
require_live_provider: true

request_concurrency: 2
episode_concurrency: 1
timeout_seconds: 60
max_retries: 2

logging:
  enabled: true
  level: INFO
  api_status_log: true
  audit_traces:
    enabled: true
    inspect_every_percent: 10
    examples_per_selected_round: 3
    seed: 1
    include_request: true
    include_raw_response: true
    include_parsed_response: true
    include_agent_memory: true
