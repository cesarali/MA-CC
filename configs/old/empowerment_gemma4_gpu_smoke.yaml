# Opt-in GPU-only artifact. Never run this configuration on a CPU implementation host.
population_size: 2
names: [A, B]
memory_length: 1
max_population_rounds: 1
committee_sizes: [0]
pulse_rounds: [1]
regimes: [neutral]
replications:
  unit: per_stratum
  count: 1
auto_analyze: false
quick_bootstrap_resamples: 0
quick_null_permutations: 0
temperature: 0.5
max_tokens: 32
seed: 7
window_interactions: 2
resolution_threshold: 0.95
provider: gemma_local
model: google/gemma-4-12B-it
fallback_provider: openai
allow_fallback: false
require_live_provider: true
request_concurrency: 1
episode_concurrency: 1
timeout_seconds: 120
max_retries: 0
decision_output_format: choice_only
choice_selection_policy: argmax
choice_temperature: 1.0
logging:
  enabled: true
  audit_traces:
    enabled: true
    inspect_every_percent: 100
    examples_per_selected_round: 2
