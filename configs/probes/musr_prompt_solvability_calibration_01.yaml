probe: musr_prompt_solvability

provider:
  type: university
  model: gwdg/openai-gpt-oss-120b
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  temperature: 1.0
  max_output_tokens: 4096
  timeout_seconds: 180
  max_retries: 0
  request_concurrency: 4
  options:
    estimated_latency_seconds: 10.0

tasks:
  dataset_dir: results/studies/musr_team_allocation_validation_01/tasks
  development: [task_001, task_002]
  heldout: [task_003]
  population_size: 12

design:
  # First-pass count explicitly allowed by the handoff. Expand competitive
  # development variants later only if needed; held-out wording remains frozen.
  prompt_repetitions: 10
  packet_repetitions: 10
  heldout_repetitions: 10
  seed: 20260901

execution:
  workers: 4

storage:
  output_dir: results/studies/musr_prompt_solvability_calibration_01

budget:
  accounting_unit: proxy_accounting_unit
  max_cost: 5.0
  max_requests: 300
  max_input_tokens: 5000000
  max_output_tokens: 1200000
