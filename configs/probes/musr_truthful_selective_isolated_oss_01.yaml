probe: musr_truthful_selective_isolated

source:
  calibration_root: results/studies/musr_truthful_selective_task_calibration_01
  revision_manifest: analysis/task_revision_manifest.json
  tasks:
    task_001: 42
    task_002: 237
    task_003: 130
  assignment_population: 24

evaluation:
  budgets: [3, 6, 9, 12]
  answer_orders: all_six
  random_replicates: 5
  random_sampling: permutation_prefix_without_replacement
  prompt_variant: P2
  seed: 20260907
  equal_task_weight_primary: true

provider:
  type: university
  model: gwdg/openai-gpt-oss-120b
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  temperature: 1.0
  max_output_tokens: 4096
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 30
  options:
    estimated_latency_seconds: 10.0

execution_profiles:
  smoke:
    concurrency: 4
    requests_per_minute: 60
  cluster:
    concurrency: 30
    requests_per_minute: 300
  invalid_response_retries: 1

storage:
  output_dir: results/studies/musr_truthful_selective_isolated_oss_01

budget:
  accounting_unit: proxy_accounting_unit
  max_logical_calls: 10818
  max_provider_attempts: 21636
  max_input_tokens: 100000000
  max_output_tokens: 90000000
  max_cost: 200.0

planning:
  assumed_latency_seconds: 10.0
