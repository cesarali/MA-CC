population_size: 24
names: [A, B]
memory_length: 5
max_population_rounds: 30
committee_sizes: [0, 2, 4, 8]
pulse_rounds: [1, 5]
regimes: [neutral, consensus_attack, pulse]
replications:
  unit: per_policy
  count: 2
auto_analyze: true
quick_bootstrap_resamples: 200
quick_null_permutations: 200
convention_roles:
  strong_name: A
  weak_name: B
  source: calibration
temperature: 0.5
max_tokens: 15
seed: 1
window_interactions: 72
resolution_threshold: 0.95
provider: openai
model: gpt-4o-mini
fallback_provider: openai
allow_fallback: false
request_concurrency: 20
episode_concurrency: 2
timeout_seconds: 60
max_retries: 2

logging:
  enabled: true
  level: INFO
  api_status_log: true
  audit_traces:
    enabled: true
    inspect_every_percent: 10
    examples_per_selected_round: 3
    seed: 1
    include_request: true
    include_raw_response: true
    include_parsed_response: true
    include_agent_memory: true
