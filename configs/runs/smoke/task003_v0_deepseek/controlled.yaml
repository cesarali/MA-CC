# Local trace run: truth-target controller, the v0 cell-0005 condition.
#
# Reproduces 21-09-2026-full-vs-report-v0 config-0001~cell-0005 (final truth
# share 0.483, the worst truth-target cell) with agent and controller reasoning
# retained. Only three things differ from that cell:
#
#   storage.artifact_profile: full   - v0 used dashboard_semantic, which drops
#     verbose_episode_history and per_episode_prompt_files, so the agents'
#     private_reason (game.py:617) and the controller's
#     communication_choice_reason plus controller_visible_input
#     (runtime.py:2389) were never written to disk.
#   llm_provider.request_concurrency: 4 - v0 used 10. The DeepInfra account is
#     shared with a 384-concurrency cluster run against a 400 cap, so this run
#     takes the remaining headroom and no more.
#   execution.repetitions: 5 - v0 ran 5 per cell and they ranged 0.08 to 1.00.
llm_provider: {type: neuralwatt, model: deepseek-v4-flash, credentials_env: NEURALWATT_API_KEY, timeout_seconds: 300, max_retries: 4, request_concurrency: 5, temperature: 1.0, max_output_tokens: 512, options: {estimated_latency_seconds: 3.0}}
prompt: {schema_version: 2, prompt_family: relational_blackboard_ballot, prompt_version: 4, response_contract: {type: relational_blackboard_ballot, allowed_values: [A, B, C]}}
game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 10
  topology: complete
  options:
    task_family: musr_team_allocation
    task_dataset_dir: results/studies/musr_truthful_selective_task_calibration_01/tasks
    task_id: task_003
    dynamics_mode: reasoning
    rounds: 10
    social_group_size: 12
    social_mode: board
    board: {sampling: uniform, message_lifetime_rounds: 1, exclude_self_authored: true, allow_no_post: true, allow_participant_requests: true, communication_profile: full_communication, require_grounded_reports: true, report_citation_scope: active_or_observed, no_citable_fact_action: none}
    epistemic_persistence: 0.75
    vote_visibility: public
    prompt_version: 4
    receiver_epistemic_disposition: vigilant
    stop_on_consensus: false
    invalid_response_retries: 4
    expected_validation_failure_rate: 0.15
    initialization: {mode: paired_local_vote, artifact_dir: results/studies/task003_v0_deepseek_initializations, require_artifact: true}
control:
  mechanism: relational_round_budgeted
  options:
    target: correct
    sensor_sample_size: 12
    policy: soft_target
    threshold: 0.50
    beta: 4.0
    intervention_budget: 12
    advocacy_schedule: soft
    message_mode: recommendation_only
    controller_actuation_mode: adaptive_communication
    controller_timing: dawn_only
    allow_controller_requests: true
    allow_controller_directives: true
    controller_communication_policy: llm_structured_v1
    controller_communication_policy_version: 1
    controller_communication_fallback_policy: contextual_weighted_v1
    controller_communication_max_retries: 2
    controller_report_cooldown_rounds: 1
    controller_report_max_posts_per_fact: 3
    controller_report_selection_strategy: target_preserving_v1
execution: {seed: 20260907, repetitions: 5, parallelism: 5, fail_fast: false}
pricing: {mode: offline, require_fresh_at_launch: false, fallback_policy: deny, explicit_unknown_price_override: false}
budget: {accounting_unit: USD, system_max_cost_per_run: 50.0, max_cost_per_run: 50.0, max_provider_requests: 150000, max_input_tokens: 50000000, max_output_tokens: 50000000, allow_unbounded_paid_requests: false}
logging: {level: INFO, console: true, audit: true, comet: false, options: {prompt_examples: {count: 24, scope: episode}}}
storage: {output_dir: results, format: jsonl, artifact_profile: full, checkpoint_mode: episode, overwrite: false}
analysis: {enabled: false, estimators: []}
metrics: {enabled: true, comet_export: []}
observability: {schema_version: 1, comet: {writer: master_only, heartbeat_seconds: 20, progress_metrics: [episodes_done], grid_image_every_n_episodes: 1, sweep_experiment: false, cell_reporting: master, metric_plots: true}}
experiment:
  name: task003-v0-deepseek-controlled
  description: Task-003 truth-target controller at b=12, rho=0.75, full communication, with agent and controller reasoning retained.
  tags: [musr, blackboard, task003, truth-control, trace, local]
  metadata: {study: task003_v0_deepseek, arm: controlled, task_id: task_003, candidate_id: 130, task_file_sha256: 1ec61ccc9578e2bcbd6a027035231dcd1ee39d44892d95b8b6ae2e9f18fdfbdb, private_assignment_sha256: aad3e64f7a713534667e04984c9911423b94c96381ec9b8ff21f90714aaea0a4, controller_pool_sha256: b90a3267c26212194e916777795db0751008d8802d45e35a67088fb8a0ce49d0, ground_truth: ALLOCATION_0, controller_target: ALLOCATION_0, controller_target_is_truth: true, target_semantics: truth, population_size: 24, population_rounds: 10, social_group_size: 12, sensor_sample_size: 12, beta: 4.0, theta: 0.5, repetitions: 5, common_random_numbers_across_grid: true, paired_initialization_across_grid: true}
grid:
  game.options.epistemic_persistence: [0.75, 1.0]
  game.options.board.communication_profile: [report_only, full_communication]
  control.options.target: [correct, ALLOCATION_2]
  control.options.intervention_budget: [3, 12]
