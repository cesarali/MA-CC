study: {name: task003_v0_deepseek}
configs: [controlled.yaml, no_control.yaml]
execution:
  mode: auto
  # NeuralWatt admits ~5 concurrent per key regardless of what we request;
  # anything above returns 429. Measured ~115 RPM on this workload.
  target_rpm: 115
  assumed_latency_seconds: 3.0
  max_active_nodes: 1
  throttle: 1
  cpus_per_task: 1
  memory: 2G
  time_limit: "12:00:00"
  partition: main
  qos: normal
  results_root: results/studies/task003_v0_deepseek
  provider_load_control: {mode: "off"}
analysis: {recipe: analysis.yaml}
