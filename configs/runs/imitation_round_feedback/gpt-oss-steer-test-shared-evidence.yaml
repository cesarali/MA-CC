# Macroscopic steerability test, EVIDENCE-SUPPORTED ARM — gpt-oss-120b.
#
# MATCHED PAIR. This file is gpt-oss-steer-test.yaml with exactly one
# scientific field changed: `control.options.evidence_mode: shared_fact`.
# Same five tasks, same seed (20260813), q = 1, 10 rounds, 5 repetitions,
# b/N = {0.25, 0.75, 1.0}, targets {correct, random_incorrect}, same sensing
# and policy parameters, same provider, prompts, budget, logging, metrics,
# analysis, aggregation and observability. Everything else that differs is run
# identity only: experiment name, description, tags, metadata, and the paths in
# the commands below. Verify with:
#
#   diff configs/runs/imitation_round_feedback/gpt-oss-steer-test.yaml \
#        configs/runs/imitation_round_feedback/gpt-oss-steer-test-shared-evidence.yaml
#
# NO NEW BASELINE. The uncontrolled arm is gpt-oss-steer-test-no-control.yaml,
# reused as-is; b = 0 does not depend on how the controller phrases itself.
#
# THE QUESTION
#
# Does increasing controller strength visibly move the population toward the
# controller's target? Nothing more. The readout is the ordinary trajectory
# output already produced by this game — `m_ctrl` (alignment with this
# episode's controller target), `m_truth` (alignment with the correct answer),
# the per-round vote shares, and the final winner — read as a ladder in b/N.
# No new estimators, no new statistics: the `analysis` block below is Grid D's,
# carried over verbatim rather than extended. If the CMI/MI machinery is not
# wanted for this run at all, set `analysis.enabled: false`; it changes nothing
# about which trajectories are recorded.
#
# THE LADDER
#
# `control.options.intervention_budget` is a count of controlled focal slots per
# population round, out of N = 24 (the runtime records it as
# `actuation_fraction = intervention_budget / N`). With `social_group_size: 1`
# each focal sees exactly one social slot, so a controlled slot means that
# focal's only peer is replaced by the controller for that round:
#
#   b =  6  ->  b/N = 0.25   a quarter of the population hears the controller
#   b = 18  ->  b/N = 0.75
#   b = 24  ->  b/N = 1.00   every focal's single peer is the controller
#
# There is no b = 0 / no-control arm here by design: this run is the controlled
# ladder only. The uncontrolled baseline is its own companion config, over the
# same five tasks and with the same q, N, rounds and repetitions:
# gpt-oss-steer-test-no-control.yaml. It uses the repository's own
# `control.mechanism: none`, so the baseline is measured once rather than
# duplicated under each controller target.
#
# WHAT `evidence_mode: shared_fact` CHANGES
#
# The controller's public reason goes from
#
#   Based on the discussion so far, Z still looks like the strongest option to
#   me and deserves more weight.
#
# to the same line plus `Relevant information: <one fact>`, where the fact is
# copied verbatim from the task's SHARED set Is. Is is the block every agent is
# already shown in its own prompt, so this changes how the control signal is
# JUSTIFIED, not how much information the population has. The unshared pool is
# unreachable from the selector, and nothing is paraphrased or invented.
#
# EVIDENCE ASYMMETRY — READ BEFORE INTERPRETING THE TARGET ARMS
#
# Fact selection prefers shared facts that NAME the target (see §5.7 of
# docs/documentation/games/imitation_feedback/imitation_round_feedback.md).
# It selects on mention, not on support. In a hidden profile the shared block
# is deliberately built to favour a decoy, so across these five tasks the two
# target arms do NOT receive evidence of equal quality:
#
#   arm                 clean supporting fact available
#   random_incorrect    most wrong options (West City, East Town, Lab Alpha,
#                       Datacenter Alpha/Beta, Warehouse B, Camp Summit)
#   correct             none of the five. The only Is fact naming Camp Pinecone
#                       reports bears; the only one naming Warehouse C is the
#                       sentence whose punchline favours Warehouse B; Datacenter
#                       Gamma's leads with a flood warning; and no Is fact names
#                       Lab Gamma at all, so that arm falls back to the whole
#                       pool, two thirds of which incriminates Lab Alpha.
#
# So under this config the controller advocating the CORRECT answer will often
# cite evidence that argues against itself, while the reverse arm usually gets a
# genuinely supporting fact. That is a real property of the corpus, not a bug in
# the selector, but it means a raw `correct` vs `random_incorrect` gap measured
# here confounds "does citing evidence help steering" with "shared evidence in a
# hidden profile points at the wrong answer". Compare each arm against its own
# cell in gpt-oss-steer-test.yaml (same task, same target, same b) rather than
# comparing the two arms to each other within this file.
#
# The per-task, per-target selection table is in
# docs/handoff/18082026_controller_shared_fact_evidence_handoff.md.
#
# FIVE TASKS, TASK-AGNOSTIC TARGETS
#
# The five tasks are all K = 3 options with 4 latent evidence types and a full
# (10-variant) paraphrase pool per evidence type, so every one of them expands
# to N = 24 under `paraphrased_replication` with no variant reuse. The first
# three are Grid D's tasks, kept so the b = 6 / q = 1 cells stay comparable
# with that pilot; the other two were chosen for framings the anchors do not
# already cover: inbound humanitarian logistics, and the one task in the pool
# that is deliberate planning rather than escape from an imminent hazard.
#
# Both target arms are task-agnostic, exactly as in Grid D: `correct` aims at
# the task's own correct answer, `random_incorrect` draws one wrong option
# uniformly from the episode seed and holds it for the whole episode. The
# reverse arm is what makes steerability legible — under it `m_ctrl` and
# `m_truth` come apart, so a population moving toward the controller cannot be
# confused with a population reasoning its way to the right answer.
#
# MODEL: gwdg/openai-gpt-oss-120b, a reasoning model. See the note on
# `llm_provider.max_output_tokens` before touching it.
#
# SIZE: 5 tasks x 2 targets x 3 budgets = 30 cells, 5 repetitions each
# (`execution.repetitions: 5`), 150 episodes, 240 provider calls per episode
# (24 agents x 10 rounds, uniform_random initialization adds none) = 36,000
# calls. NOTE: the same line in gpt-oss-steer-test.yaml still says "10
# repetitions each, 300 episodes"; that file also sets `repetitions: 5`, so its
# comment is stale and the two runs are in fact matched at 150 episodes.
#
# BEFORE LAUNCHING: emergency_supply_drop and choosing_base_camp were the two
# tasks missing from data/hidden_bench/scaled/paraphrased_replication/N_24.json.
# They were built on 2026-08-18 while validating this config, so that file now
# holds all six and no in-run build should be triggered. `data/` is gitignored,
# so re-run the commands below on any machine that has not built them yet -
# it is deterministic and makes no LLM calls.
#   for t in emergency_supply_drop choosing_base_camp; do
#     conda run -n MA-CC --no-capture-output python \
#       scripts/local_llms/hiddenbench_population_pipeline/scripts/ensure_paraphrased_population.py \
#       --agents 24 --task "$t"
#   done
#
# RUN FROM THE REPOSITORY ROOT
#
# Preflight before model inference:
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment preflight \
#     --config configs/runs/imitation_round_feedback/gpt-oss-steer-test-shared-evidence.yaml \
#     --output-dir inspection/gpt_oss_steer_test_shared_evidence_preflight
#
# Launch with live console output:
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment run \
#     --config configs/runs/imitation_round_feedback/gpt-oss-steer-test-shared-evidence.yaml \
#     --output-dir results
#
# Save the same console output instead:
#   mkdir -p logs
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment run \
#     --config configs/runs/imitation_round_feedback/gpt-oss-steer-test-shared-evidence.yaml \
#     --output-dir results 2>&1 | tee logs/gpt_oss_steer_test_shared_evidence.log

llm_provider:
  type: university
  model: gwdg/openai-gpt-oss-120b
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 4
  temperature: 0.0
  # gpt-oss is a reasoning model: it emits a long `reasoning_content` before the
  # answer and BOTH are charged against max_tokens. A measured public-ballot
  # prompt for this game spent 684 completion tokens, ~650 of them reasoning.
  # Below that the answer is truncated away, `content` arrives empty, and the
  # adapter rejects the body - which is exactly how every earlier gpt-oss smoke
  # in results/gpt_oss_120b_smoke_test* died, at 256, 512 and 1024.
  #
  # This is not a cost dial. The budget guard reserves this many tokens per call
  # and then settles the reservation against actual usage, so a generous ceiling
  # changes the preflight quote and never what you pay. Spend is bounded by
  # budget.max_cost_per_run below. Do not trim this back.
  #
  # `reasoning_effort: low` would cut the reasoning itself, but the proxy
  # rejects the parameter (HTTP 400, UnsupportedParamsError).
  max_output_tokens: 4096
  options:
    estimated_latency_seconds: 10.0

prompt:
  schema_version: 2
  prompt_family: hidden_bench_public_ballot
  prompt_version: 1
  response_contract:
    type: hidden_bench_public_ballot

game:
  type: hidden_bench_imitation_round_feedback
  population_size: 24
  horizon: 10
  topology: complete
  options:
    task_set: expanded
    task_id: evacuation_north_hill
    profile: hidden
    assignment_scheme: paraphrased_replication
    population_preparation:
      auto_build_missing: true
      paraphrase_annotations: data/hidden_bench/annotations/paraphrases.json
    dynamics_mode: reasoning
    rounds: 10
    # q = 1: one social slot per focal per round. Fixed, not swept - a
    # controlled slot therefore replaces the focal's only peer.
    social_group_size: 1
    vote_visibility: public
    memory_size: 0
    allow_relay: true
    prompt_version: 1
    inform_asymmetry: false
    scenario_variant: 1
    stop_on_consensus: false
    invalid_response_retries: 1
    expected_validation_failure_rate: 0.05
    initialization:
      mode: uniform_random
    classical:
      kernel: controlled_imitation_round_reference

control:
  mechanism: round_soft_target_budgeted
  options:
    target: correct
    sensor_sample_size: 12
    policy: soft_target
    threshold: 0.5
    beta: 4.0
    intervention_budget: 6
    template_version: 3
    # THE ONLY SCIENTIFIC DIFFERENCE FROM gpt-oss-steer-test.yaml.
    # The controller's public reason gains one verbatim fact from the task's
    # SHARED set Is - text every agent already holds - selected once per round
    # from the episode seed. See the EVIDENCE ASYMMETRY note in the header
    # before reading any correct-vs-incorrect contrast off this run.
    evidence_mode: shared_fact

execution:
  seed: 20260813
  repetitions: 5
  # Episode concurrency is shared across the whole grid, not per cell, so this
  # stays at Grid D's value even though there are fewer repetitions per cell.
  parallelism: 40
  fail_fast: true

pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false

budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 300.0
  max_cost_per_run: 300.0
  max_provider_requests: 600000
  max_input_tokens: 1000000000
  max_output_tokens: 100000000
  allow_unbounded_paid_requests: false

logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    prompt_examples:
      count: 1
      scope: cell

storage:
  output_dir: results
  format: jsonl
  artifact_profile: results_only
  checkpoint_mode: episode
  overwrite: false

# Carried over from Grid D unchanged. Nothing here is new; the steerability
# readout does not depend on any of it.
analysis:
  enabled: true
  estimators:
    - round_sensing_mi
    - round_target_actuation_cmi
    - round_truth_actuation_cmi
    - round_controller_action_entropy
    - round_controller_action_entropy_given_population
    - round_target_information_fraction
    - round_dual_action_state_fraction
    - round_dual_action_event_fraction
    - round_single_action_slice_fraction
    - round_conditioning_state_count
    - round_singleton_fraction
    - round_target_signed_actuation
    - round_truth_signed_actuation
    - round_sensor_mae
    - round_sensor_mse
  options:
    bootstrap_resamples: 1000
    null_permutations: 1000
    confidence: 0.95
    seed: 20260813
    # Analyze and write the report immediately after the cell's last repetition.
    per_cell_reports: true
  # Publish that cell's information metrics and report assets to Comet.
  comet_export: true

metrics:
  enabled: true
  comet_export: []

# `cell_metrics` is the steerability readout: m_ctrl against m_truth, per cell.
aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order, dominant_action_share]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0

observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 10
    sweep_experiment: true
    # Finished-cell aggregates and configured analysis share the master run.
    cell_reporting: master
    metric_plots: true

experiment:
  name: hidden-bench-round-feedback-gpt-oss-120b-steer-test-shared-evidence
  description: Matched arm of the macroscopic steerability test with evidence_mode shared_fact - the controller cites one true shared fact alongside the same advocacy, over the identical five tasks, targets and b/N ladder.
  tags: [hidden-bench, imitation, round-feedback, gpt-oss-120b, steerability, budget-ladder, shared-evidence]
  metadata:
    study: macroscopic_steerability
    matched_reference: gpt-oss-steer-test.yaml
    controller_evidence_mode: shared_fact
    population_rounds: 10
    social_group_sizes: [1]
    sensor_sample_sizes: [12]
    intervention_budgets: [6, 18, 24]
    budget_fractions: [0.25, 0.75, 1.0]
    controller_targets: [correct, random_incorrect]
    control_arms: controlled_only
    task_count: 5

grid:
  # Five K=3 tasks with 4 evidence types and full paraphrase pools. The first
  # three are Grid D's; the name with spaces is a corpus task id given by name
  # so the cell stays readable in reports. Five distinct decision framings:
  # hazard evacuation, forensic deduction, IT failover, inbound logistics, and
  # expedition planning. Excluded as near-duplicates of those:
  # critical_hospital_transfer (the same "re-route to one of three facilities"
  # shape as datacenter_emergency_migration), and meteor_shower_shelter,
  # Antarctic Storm Safe Haven and Space Evacuation Decision (all the same
  # "flee to one of three shelters" shape as evacuation_north_hill).
  game.options.task_id:
    - evacuation_north_hill
    - "Laboratory Theft Deduction"
    - datacenter_emergency_migration
    - emergency_supply_drop
    - choosing_base_camp
  # Both arms are task-agnostic: one aims at the task's correct answer, the
  # other at a uniformly drawn wrong option held fixed for the episode.
  control.options.target: [correct, random_incorrect]
  # b/N = 0.25, 0.75, 1.0 at N = 24.
  control.options.intervention_budget: [6, 18, 24]
