# Macroscopic steerability test, no-control baseline - gpt-oss-120b.
#
# The uncontrolled companion to gpt-oss-steer-test.yaml. Model, prompt, game,
# tasks, q, N, rounds, seed and repetitions are identical to that file; the one
# difference is `control.mechanism: none`.
#
# WHY THIS IS A SEPARATE RUN
#
# With no controller there is no target and no budget, so neither
# `control.options.target` nor `control.options.intervention_budget` names an
# experimental condition. Folding the baseline into the controlled grid as a
# b = 0 arm would therefore have replicated one and the same baseline under both
# target arms - the same 50 episodes run twice. The grid here is the task axis
# alone, so the baseline is measured once.
#
# THE READOUT
#
# This is the b/N = 0 rung of the ladder in gpt-oss-steer-test.yaml: where the
# population goes on its own. The round-feedback analyzer emits no controller
# estimates for no-control rows, and `m_ctrl` is not meaningful here because no
# target was ever set - it degenerates to `m_truth`. What this run contributes
# is the uncontrolled `m_truth`, the per-round vote shares and the final winner,
# read against the controlled rungs task by task.
#
# THE FIVE TASKS
#
# Identical to the controlled config, and identical for the same reason: K = 3
# with 4 latent evidence types and a full paraphrase pool, so each expands to
# N = 24 under `paraphrased_replication` with no variant reuse. If that list
# changes there, it must change here too, or the baseline stops matching.
#
# MODEL: gwdg/openai-gpt-oss-120b, a reasoning model. See the note on
# `llm_provider.max_output_tokens` before touching it.
#
# SIZE: 5 tasks = 5 cells, 10 repetitions each, 50 episodes, 240 provider calls
# per episode (24 agents x 10 rounds).
#
# BEFORE LAUNCHING: emergency_supply_drop and choosing_base_camp are not yet in
# data/hidden_bench/scaled/paraphrased_replication/N_24.json. See the same note
# in gpt-oss-steer-test.yaml; building them once serves both runs.
#
# RUN FROM THE REPOSITORY ROOT
#
# Preflight before model inference:
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment preflight \
#     --config configs/runs/imitation_round_feedback/gpt-oss-steer-test-no-control.yaml \
#     --output-dir results/inspection/gpt_oss_steer_test_no_control_preflight
#
# Launch with live console output:
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment run \
#     --config configs/runs/imitation_round_feedback/gpt-oss-steer-test-no-control.yaml \
#     --output-dir results
#
# Save the same console output instead:
#   mkdir -p logs
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment run \
#     --config configs/runs/imitation_round_feedback/gpt-oss-steer-test-no-control.yaml \
#     --output-dir results 2>&1 | tee logs/gpt_oss_steer_test_no_control.log

llm_provider:
  type: university
  model: gwdg/openai-gpt-oss-120b
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 4
  temperature: 0.0
  # gpt-oss emits reasoning_content and the answer inside this shared budget.
  # The budget guard reserves the ceiling and settles against actual usage, so
  # this is not a cost dial. Spend is bounded by budget.max_cost_per_run.
  max_output_tokens: 4096
  options:
    estimated_latency_seconds: 10.0

prompt:
  schema_version: 2
  prompt_family: hidden_bench_public_ballot
  prompt_version: 1
  response_contract:
    type: hidden_bench_public_ballot

game:
  type: hidden_bench_imitation_round_feedback
  population_size: 24
  horizon: 10
  topology: complete
  options:
    task_set: expanded
    task_id: evacuation_north_hill
    profile: hidden
    assignment_scheme: paraphrased_replication
    population_preparation:
      auto_build_missing: true
      paraphrase_annotations: data/hidden_bench/annotations/paraphrases.json
    dynamics_mode: reasoning
    rounds: 10
    # q = 1: one social slot per focal per round, as in the controlled config.
    # Here that slot is always a real peer.
    social_group_size: 1
    vote_visibility: public
    memory_size: 0
    allow_relay: true
    prompt_version: 1
    inform_asymmetry: false
    scenario_variant: 1
    stop_on_consensus: false
    invalid_response_retries: 1
    expected_validation_failure_rate: 0.05
    initialization:
      mode: uniform_random
    classical:
      # This names the classical comparison kernel; it does not enable control.
      kernel: controlled_imitation_round_reference

# Explicit no-op controller. It emits no controller action, takes no sensor
# sample, and controls no population positions.
control:
  mechanism: none

execution:
  seed: 20260813
  repetitions: 5
  # Episode concurrency is shared across the whole grid, not per cell.
  parallelism: 40
  fail_fast: true

pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false

budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 300.0
  max_cost_per_run: 300.0
  max_provider_requests: 600000
  max_input_tokens: 1000000000
  max_output_tokens: 100000000
  allow_unbounded_paid_requests: false

logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    prompt_examples:
      count: 1
      scope: cell

storage:
  output_dir: results
  format: jsonl
  artifact_profile: results_only
  checkpoint_mode: episode
  overwrite: false

# The round-feedback analyzer intentionally emits no controller estimates for
# no-control rows; behavioral trajectories and m_truth remain available through
# the ordinary metrics and aggregation outputs below. Nothing here is new: the
# estimator list matches the controlled config exactly.
analysis:
  enabled: true
  estimators:
    - round_sensing_mi
    - round_target_actuation_cmi
    - round_truth_actuation_cmi
    - round_controller_action_entropy
    - round_controller_action_entropy_given_population
    - round_target_information_fraction
    - round_dual_action_state_fraction
    - round_dual_action_event_fraction
    - round_single_action_slice_fraction
    - round_conditioning_state_count
    - round_singleton_fraction
    - round_target_signed_actuation
    - round_truth_signed_actuation
    - round_sensor_mae
    - round_sensor_mse
  options:
    bootstrap_resamples: 1000
    null_permutations: 1000
    confidence: 0.95
    seed: 20260813
    per_cell_reports: true
  comet_export: true

metrics:
  enabled: true
  comet_export: []

# Same cell_metrics as the controlled config so the two runs line up. Here
# m_ctrl carries no independent meaning; m_truth is the baseline of interest.
aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order, dominant_action_share]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0

observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 10
    sweep_experiment: true
    cell_reporting: master
    metric_plots: true

experiment:
  name: hidden-bench-round-feedback-gpt-oss-120b-steer-test-no-control
  description: Uncontrolled baseline for the macroscopic steerability test, over the same five HiddenBench tasks, q and N as gpt-oss-steer-test.yaml.
  tags: [hidden-bench, imitation, round-feedback, gpt-oss-120b, steerability, no-control]
  metadata:
    study: macroscopic_steerability
    population_rounds: 10
    social_group_sizes: [1]
    control_mechanism: none
    control_arms: baseline_only
    task_count: 5
    companion_config: gpt-oss-steer-test.yaml

grid:
  # Exactly the task list in gpt-oss-steer-test.yaml. With no controller there
  # is no target and no budget axis, so the task axis is the whole grid.
  game.options.task_id:
    - evacuation_north_hill
    - "Laboratory Theft Deduction"
    - datacenter_emergency_migration
    - emergency_supply_drop
    - choosing_base_camp
