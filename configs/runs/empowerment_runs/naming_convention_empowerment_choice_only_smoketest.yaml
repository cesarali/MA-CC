schema_version: 1
# Naming-convention EMPOWERMENT phase diagram, CHOICE-ONLY (no-reasoning) arm.
#
# Identical to naming_convention_empowerment_reasoning_university_v3.yaml
# except response_contract: choice_only (a bare "Q" or "M", no JSON, no
# explanation) and a much smaller max_output_tokens - see that file's header
# for why the reasoning/no-reasoning split has to be two files rather than a
# second grid axis here.
llm_provider:
  type: university
  model: gwdg/qwen3-30b-a3b-instruct-2507
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 60
  max_retries: 2
  request_concurrency: 10
  temperature: 0.0
  # A bare one-word answer; 64 matches the University provider component's
  # own default and the tutorial's choice_only sizing.
  max_output_tokens: 64
  options:
    estimated_latency_seconds: 3.0
prompt:
  schema_version: 2
  prompt_family: naming_convention_decision
  prompt_version: 1
  message_mode: merge_consecutive_roles
  block_separator: "\n\n"
  response_contract:
    type: choice_only
    allowed_values: [Q, M]
game:
  type: naming_convention
  population_size: 10   # overwritten per cell by the grid below; [10, 20]
  horizon: 100
  topology: complete
  options:
    actions: [Q, M]
    memory_size: 3
    success_payoff: 100
    failure_payoff: -50
    pair_sampling: uniform_two_distinct
    simultaneous_pair_decisions: true
    randomize_presented_action_order: true
    prompt_contract: naming_convention_decision
    response_contract: choice_only
    parser_contract: choice_only_v1
    invalid_response_retries: 2
    expected_validation_failure_rate: 0.0
    representative_memory_size: 1
    stop_on_convergence: false
execution:
  seed: 20260806
  # SMOKETEST: 2 episodes PER CELL, not 10 - just enough to confirm the job
  # actually runs end to end (preflight -> run -> analysis) before submitting
  # the full grid. 2 cells (population_size 10, 20) x 2 = 4 episodes.
  repetitions: 2
  parallelism: 10
  fail_fast: true
pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  # SMOKETEST: caps scaled down from the full 10-rep file's 12000
  # requests / 3,480,000 input / 768,000 output for a 2-cell x 2-episode
  # grid (1/5 the episodes), with margin. Live preflight still verifies the
  # real number before anything sends.
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 1.5
  max_cost_per_run: 1.5
  max_provider_requests: 3000
  max_input_tokens: 900000
  max_output_tokens: 200000
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: true
  # false on purpose: `mas-cc experiment run` does not wire Comet per episode
  # for a grid - see the reasoning arm's header.
  comet: false
storage:
  output_dir: results
  format: jsonl
  checkpoints: true
  overwrite: false
analysis:
  enabled: false
  estimators: []
metrics:
  enabled: true
  comet_export: []
aggregation:
  forward_fill: absorbing
  relabel_by_winner: true
  percentiles: [10, 50, 90]
  rolling_window: 5
  cell_metrics:
    - dominant_action_share
    - action_share_relabelled
    - active_fraction
    - consensus_round
    - converged_fraction
  sweep_metrics:
    - terminal_mi
    - lagged_cmi
    - mi_null_band
  horizons: [1]
  null_permutations: 200
experiment:
  name: naming-convention-empowerment-choice-only-smoketest
  description: >-
    SMOKETEST (2 episodes/cell) for the naming-convention empowerment phase
    diagram, choice-only arm. Verifies the job runs end to end against the
    live University proxy before submitting the full 10-episode/cell grid.
  tags:
    - empowerment
    - mutual-information
    - grid
    - university
    - phase-diagram
    - choice-only
    - population-size
    - smoketest
grid:
  game.population_size: [10, 20]
