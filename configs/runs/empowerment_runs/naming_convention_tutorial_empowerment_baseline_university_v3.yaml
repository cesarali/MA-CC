# The no_committee baseline arm, companion to
# naming_convention_tutorial_empowerment_university_v3.yaml. Same game, same
# seed, same episode count per condition (10) - the only thing that differs
# is `control.mechanism: none`, so agent-000 plays normally like every other
# agent instead of being forced.
#
# This is a PLAIN experiment, not a grid: there is nothing to sweep here, one
# arm only. `mas-cc analysis empowerment --grid-dir` expects a `cells/`
# directory (grid.py's output shape) and this run does not produce one -
# that command is for the push_Q/push_M grid, not this file.
#
# What this arm is for (docs/tdd/architecture/03082026_committee_empowerment_plan.md,
# Workstream 2): a negative control. Read its own
# metrics/final.csv / dominant_action_share and rolling_coordination_rate
# across these 10 episodes and confirm the population converges ~50/50
# between Q and M with no directional bias, absent any committee - i.e. that
# whatever MI the push grid reports is coming from the intervention, not from
# some pre-existing asymmetry in the game/prompt/provider that would show up
# even with nobody pushing.
llm_provider:
  type: university
  model: gwdg/qwen3-30b-a3b-instruct-2507
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 60
  max_retries: 2
  request_concurrency: 10
  temperature: 0.0
  max_output_tokens: 128
  options:
    estimated_latency_seconds: 3.0
prompt:
  schema_version: 2
  prompt_family: naming_convention_decision
  prompt_version: 1
  message_mode: merge_consecutive_roles
  block_separator: "\n\n"
  response_contract:
    type: choice_only
    allowed_values: [Q, M]
game:
  type: naming_convention
  population_size: 5
  horizon: 20
  topology: complete
  options:
    actions: [Q, M]
    memory_size: 3
    success_payoff: 100
    failure_payoff: -50
    pair_sampling: uniform_two_distinct
    simultaneous_pair_decisions: true
    randomize_presented_action_order: true
    prompt_contract: naming_convention_decision
    response_contract: choice_only
    parser_contract: choice_only_v1
    invalid_response_retries: 2
    expected_validation_failure_rate: 0.0
    representative_memory_size: 1
    stop_on_convergence: false
# control: omitted -> defaults to ControlConfig(mechanism="none"), i.e.
# NoneControl.override() always returns None. Every agent, including
# agent-000, decides normally through the provider. Left explicit below
# anyway so this file states its own condition rather than relying on a
# default silently doing the work.
control:
  mechanism: none
execution:
  seed: 20260808
  repetitions: 10   # matches one cell of the push grid, for a fair comparison
  parallelism: 5
  fail_fast: true
pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  # 220 requests / $0.25 / 200k input / 30k output per episode (the tutorial
  # config's own sizing) x 10 episodes, plus ~15% headroom. No agent is
  # forced here, so unlike the push grid this estimate is NOT conservative by
  # a fifth - actual spend should land close to this.
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 2.9
  max_cost_per_run: 2.9
  max_provider_requests: 2530
  max_input_tokens: 2300000
  max_output_tokens: 345000
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: true
  # false for the same reason as the push grid: `mas-cc experiment run` does
  # not wire Comet per episode even for a plain (non-grid) experiment.
  comet: false
storage:
  output_dir: results
  format: jsonl
  checkpoints: true
  overwrite: false
analysis:
  enabled: false
  estimators: []
metrics:
  enabled: true
  comet_export: []
experiment:
  name: naming-convention-tutorial-empowerment-baseline-university
  description: >-
    no_committee baseline, 10 episodes at N=5, H=20 - the negative-control
    arm for naming_convention_tutorial_empowerment_university_v3.yaml.
  tags: [empowerment, baseline, negative-control, university, tutorial]
