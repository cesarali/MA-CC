schema_version: 1
# The null config: epsilon = 0.5, where the true pairwise mutual information is
# exactly zero. Run `mas-cc synthetic sweep --config` against this to measure
# what the estimators report when there is nothing to report - the finite-sample
# bias, and therefore the magnitude below which an MI from a real run means
# nothing at all.
llm_provider:
  component: ../components/llm_providers/synthetic_agent.yaml
prompt:
  component: ../components/prompts/synthetic_agent_v1.yaml
game:
  component: ../components/games/synthetic_bernoulli.yaml
execution:
  schema_version: 1
  # Sweeps take consecutive seeds from here, so a run is reproducible from this
  # one number plus the seed count.
  seed: 20260805
  repetitions: 1
  parallelism: 1
  fail_fast: true
pricing:
  schema_version: 1
  mode: offline
  max_age_seconds: 86400
  require_fresh_at_launch: false
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  schema_version: 1
  accounting_unit: USD
  system_max_cost_per_run: 0.0
  max_cost_per_run: 0.0
  allow_unbounded_paid_requests: false
logging:
  component: ../components/logging/default.yaml
storage:
  component: ../components/storage/local.yaml
analysis:
  schema_version: 1
  enabled: false
  estimators: []
metrics:
  schema_version: 1
  enabled: true
  # Nothing is exported. A calibration rehearsal has no business uploading
  # anything, and keeping this empty is what makes that a property of the
  # config rather than of whoever remembered to pass a flag.
  comet_export: []
experiment:
  schema_version: 1
  name: synthetic-bernoulli-null
  description: >-
    Game 1 at epsilon = 0.5, where I(A_i;A_j) = 0 exactly. Establishes the
    plug-in estimator's finite-sample bias and the significance floor.
  tags:
    - synthetic
    - calibration
    # Not spelled "null": YAML would parse that as a null value, not the word.
    - zero-mi
