llm_provider:
  type: mock
  model: deterministic-smoke
  temperature: 0.0
  max_output_tokens: 32
  options:
    response: '{"vote":"North Hill","reason":"smoke"}'
prompt:
  schema_version: 2
  prompt_family: hidden_bench_public_ballot
  prompt_version: 1
  response_contract:
    type: hidden_bench_public_ballot
    allowed_values: [West City, East Town, North Hill]
game:
  type: hidden_bench_imitation_round_feedback
  population_size: 4
  horizon: 3
  topology: complete
  options:
    task_set: vanilla
    task_id: evacuation_north_hill
    profile: hidden
    assignment_scheme: bijective
    dynamics_mode: classical
    rounds: 3
    social_group_size: 2
    vote_visibility: public
    memory_size: 0
    prompt_version: 1
    stop_on_consensus: false
    initialization:
      mode: explicit
      initial_votes: [West City, East Town, North Hill, East Town]
    classical:
      kernel: controlled_imitation_round_reference
control:
  mechanism: round_soft_target_budgeted
  options:
    target: correct
    sensor_sample_size: 2
    policy: soft_target
    threshold: 0.5
    beta: 4.0
    intervention_budget: 2
    template_version: 3
execution:
  seed: 20260813
  repetitions: 4
  parallelism: 4
  fail_fast: true
pricing:
  mode: offline
  require_fresh_at_launch: false
  fallback_policy: deny
  explicit_unknown_price_override: true
budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 0.0
  max_cost_per_run: 0.0
  max_provider_requests: 0
  max_input_tokens: 0
  max_output_tokens: 0
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: true
  comet: false
storage:
  output_dir: results
  format: jsonl
  artifact_profile: full
  checkpoint_mode: episode
  overwrite: true
analysis:
  enabled: true
  estimators:
    - round_sensing_mi
    - round_population_actuation_cmi
    - round_target_actuation_cmi
    - round_truth_actuation_cmi
    - round_controller_action_entropy
    - round_controller_action_entropy_given_population
    - round_population_information_fraction
    - round_target_information_fraction
    - round_dual_action_state_fraction
    - round_dual_action_event_fraction
    - round_single_action_slice_fraction
    - round_conditioning_state_count
    - round_singleton_fraction
    - round_target_signed_actuation
    - round_sensor_mae
    - round_sensor_mse
  options:
    bootstrap_resamples: 100
    null_permutations: 100
    confidence: 0.95
    seed: 20260813
metrics:
  enabled: true
  comet_export: []
aggregation:
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0
experiment:
  name: hidden-bench-round-feedback-classical-smoke
  description: Provider-free smoke run for exact round-level sensing and actuation budgets.
  tags: [hidden-bench, imitation, round-feedback, classical, smoke]
