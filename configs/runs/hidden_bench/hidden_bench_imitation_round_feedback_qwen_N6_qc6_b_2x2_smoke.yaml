# Tiny live-provider integration grid for the round-feedback game.
#
# Design:
#   dynamics_mode: reasoning vs classical
#   b:             0 vs 6 preallocated controlled positions
#   N:             6 agents
#   q_c:           6 sensed agents (the full population)
#   q:             2 ordinary social slots
#   horizon:       2 population rounds
#   repetitions:   2 per cell (8 episodes total)
#
# RUN FROM THE REPOSITORY ROOT
#
# 1. Provider-free structural check (does not run model inference):
#
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment preflight \
#     --config configs/runs/hidden_bench/hidden_bench_imitation_round_feedback_qwen_N6_qc6_b_2x2_smoke.yaml \
#     --output-dir inspection/hidden_bench_round_feedback_qwen_N6_qc6_b_2x2_smoke_comet_preflight
#
# 2. Run with the MA-CC environment and stream output directly to the console:
#
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment run \
#     --config configs/runs/hidden_bench/hidden_bench_imitation_round_feedback_qwen_N6_qc6_b_2x2_smoke.yaml
#
# `--no-capture-output` is what makes the progress and Comet URL appear live.
# To keep a copy of the same console output, use this instead of step 2:
#
#   mkdir -p logs
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment run \
#     --config configs/runs/hidden_bench/hidden_bench_imitation_round_feedback_qwen_N6_qc6_b_2x2_smoke.yaml \
#     2>&1 | tee logs/hidden_bench_round_feedback_qwen_N6_qc6_b_2x2_smoke_comet.log
#
# Expected startup lines include:
#
#   Results:       results/hidden_bench_imitation_round_feedback/...
#   Comet:         master -> project 'mas-cc', cells on this master
#                  https://www.comet.com/...
#
# Whenever a cell finishes, its local report and Comet publication are
# confirmed by a line beginning:
#
#   cell cell-0000 configured analysis ready: ...
#
# To use another task, change only `game.options.task_id`. Answer options, the
# correct target, and uniform initial votes are derived from that task. If its
# N_6 paraphrased population is absent, launch-time initialization builds it
# deterministically from `annotations/paraphrases.json`; no annotation/model
# call is made for population preparation.

llm_provider:
  type: university
  model: gwdg/qwen3-30b-a3b-instruct-2507
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 4
  temperature: 0.0
  # Not a cost dial: the budget guard reserves this many output tokens per call
  # and then settles the reservation against actual usage, so a generous ceiling
  # changes the preflight quote and nothing you actually pay. Setting it tight
  # saves nothing and turns an expensive call into a dead episode.
  #
  # The public-ballot contract allows a reason of up to 600 characters (~150
  # tokens) plus the JSON scaffolding, so 128 could not hold a maximal legal
  # reply. Bound spend with budget.max_cost_per_run instead.
  max_output_tokens: 512
  options:
    estimated_latency_seconds: 3.0

prompt:
  schema_version: 2
  prompt_family: hidden_bench_public_ballot
  prompt_version: 1
  response_contract:
    type: hidden_bench_public_ballot

game:
  type: hidden_bench_imitation_round_feedback
  population_size: 6
  horizon: 2
  topology: complete
  options:
    task_set: expanded
    task_id: evacuation_north_hill
    profile: hidden
    assignment_scheme: paraphrased_replication
    population_preparation:
      auto_build_missing: true
      paraphrase_annotations: data/hidden_bench/annotations/paraphrases.json
    dynamics_mode: reasoning
    rounds: 2
    social_group_size: 2
    vote_visibility: public
    memory_size: 0
    allow_relay: true
    prompt_version: 1
    inform_asymmetry: false
    scenario_variant: 1
    stop_on_consensus: false
    invalid_response_retries: 1
    expected_validation_failure_rate: 0.05
    initialization:
      mode: uniform_random
    classical:
      kernel: controlled_imitation_round_reference

control:
  mechanism: round_soft_target_budgeted
  options:
    target: correct
    sensor_sample_size: 6
    policy: soft_target
    threshold: 0.5
    beta: 4.0
    intervention_budget: 0
    template_version: 3

execution:
  seed: 20260813
  repetitions: 2
  parallelism: 2
  fail_fast: true

pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: true

budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 10.0
  max_cost_per_run: 10.0
  max_provider_requests: 500
  max_input_tokens: 10000000
  max_output_tokens: 100000
  allow_unbounded_paid_requests: false

logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    prompt_examples:
      count: 1
      scope: cell

storage:
  output_dir: results
  format: jsonl
  artifact_profile: full
  checkpoint_mode: episode
  overwrite: false

analysis:
  enabled: true
  estimators:
    - round_sensing_mi
    - round_population_actuation_cmi
    - round_target_actuation_cmi
    - round_truth_actuation_cmi
    - round_controller_action_entropy
    - round_controller_action_entropy_given_population
    - round_population_information_fraction
    - round_target_information_fraction
    - round_dual_action_state_fraction
    - round_dual_action_event_fraction
    - round_single_action_slice_fraction
    - round_conditioning_state_count
    - round_singleton_fraction
    - round_target_signed_actuation
    - round_sensor_mae
    - round_sensor_mse
  options:
    bootstrap_resamples: 50
    null_permutations: 50
    confidence: 0.95
    seed: 20260813
    per_cell_reports: true
  comet_export: true

metrics:
  enabled: true
  comet_export: []

aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order, dominant_action_share]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0

observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 1
    sweep_experiment: true
    cell_reporting: master
    metric_plots: true

experiment:
  # This new run identity avoids the partial checkpoint from the earlier
  # launch, whose resolved configuration had Comet disabled.
  name: hidden-bench-round-feedback-qwen-N6-qc6-b-2x2-smoke-comet
  description: Tiny reasoning/classical by b=0/6 integration grid with per-cell Comet analysis.
  tags: [hidden-bench, imitation, round-feedback, qwen, N6, qc6, b-grid, smoke, comet]
  metadata:
    population_rounds: 2
    social_group_size: 2
    sensor_sample_size: 6

grid:
  game.options.dynamics_mode: [reasoning, classical]
  control.options.intervention_budget: [0, 6]
