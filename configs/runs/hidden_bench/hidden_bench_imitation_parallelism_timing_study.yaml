# Base arm for the episode-parallelism calibration job. The Slurm driver runs
# this same scientific workload sequentially at parallelism 2, 5, 10, 20, and
# 50, changing only execution.parallelism, execution.seed, and experiment.name.
# Fifty short episodes ensure that every candidate has enough work to saturate
# its configured episode concurrency. Horizon 5 keeps the full study small.
llm_provider:
  type: university
  model: gwdg/qwen3-30b-a3b-instruct-2507
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 10
  temperature: 0.0
  max_output_tokens: 256
  options:
    estimated_latency_seconds: 3.0
prompt:
  schema_version: 2
  prompt_family: hidden_bench_imitation_update
  prompt_version: 2
  response_contract:
    type: hidden_bench_json_vote
game:
  type: hidden_bench_imitation
  population_size: 4
  # Whole population sweeps; two sweeps replace the former five-attempt partial run.
  horizon: 2
  topology: complete
  options:
    task_set: vanilla
    task_id: evacuation_west_city
    profile: hidden
    assignment_scheme: bijective
    dynamics_mode: reasoning
    pairing: uniform_two_distinct
    messages_per_agent: 1
    memory_size: 0
    allow_relay: true
    prompt_version: 2
    inform_asymmetry: false
    scenario_variant: 1
    stop_on_consensus: false
control:
  mechanism: threshold_target
  options:
    target: correct
    sensor_sample_size: 2
    threshold: 0.5
    template_version: 2
execution:
  seed: 20260860
  repetitions: 50
  parallelism: 2
  fail_fast: false
pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 50.0
  max_cost_per_run: 50.0
  max_provider_requests: 10000
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: false
  comet: false
  options:
    prompt_examples:
      count: 0
      scope: cell
storage:
  output_dir: results
  format: jsonl
  artifact_profile: timing_study
  checkpoint_mode: episode
  overwrite: true
  wipe_and_recompute: true
analysis:
  enabled: false
  estimators: []
  comet_export: false
metrics:
  enabled: false
  comet_export: []
aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: []
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0
observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 5
    sweep_experiment: false
    cell_reporting: master
    metric_plots: false
experiment:
  name: hidden-bench-imitation-parallelism-timing-p2
  description: Short operational study for selecting episode parallelism with provider request concurrency fixed at 10.
  tags: [hidden-bench, imitation, timing-study, parallelism]
