# HiddenBench, vanilla game, `profile: hidden` swept over every task in the
# canonical corpus (all 65 upstream tasks) - the paper's actual protocol
# (Li, Naito & Shirado, ICML 2026): each agent sees only its own private
# slice of Iu (plus the shared facts) "as intended" by the Hidden Profile
# design, discusses in a round-robin group for T passes, then votes again.
#
# Paired with hidden_bench_vanilla_full_all_tasks.yaml (profile: full,
# rounds: 0), which asks the ceiling question - "can the agent answer
# correctly given everything?" This file asks the paper's actual question -
# "can the group recover the right answer when no single agent has it?" -
# and records both the pre-discussion vote (y_pre) and the post-discussion
# vote (y_post) per task, so gap_to_full = y_post - y_full can be computed
# against the paired full-profile file in analysis.
#
# `rounds: 10, rounds_are_speaking_turns: false` matches
# hidden_bench_vanilla.yaml's single-task config (10 full round-robin
# passes = 40 discussion turns at N=4) so results are comparable to that run.
#
# `assignment_scheme: exact_replication`, not `bijective` - see the note in
# hidden_bench_vanilla_full_all_tasks.yaml: the corpus mixes N_native=3 and
# N_native=4 tasks, and bijective demands n_agents == native count, which
# breaks a fixed population_size: 4 on the 7 three-agent tasks. This is the
# one place where it matters for `hidden`: exact_replication pads/duplicates
# evidence-type labels to reach N=4 on those 7 tasks rather than raising - the
# union invariant (src/mas_cc/games/hidden_bench/data.py::assert_union_invariant)
# still holds.
#
# COST: 48 calls/episode (N pre-votes + T*N discussion turns + N post-votes)
# x <=3 (invalid_response_retries: 2, worst case) = 144/episode x 65 tasks x
# 1 repetition = 9360 provider requests, worst case - about 6x the
# full-profile file's cost because of the discussion phase.
#
# RUN THIS FROM A TERMINAL. First enter the repository (change this path if
# your checkout lives somewhere else):
#   cd /home/cesarali/LanguageGames/MA-CC
#
# The commands below use the MA-CC Conda environment without requiring you to
# activate it. `--no-capture-output` keeps logs, progress bars, provider
# errors, and the final result path visible while the command runs. Make sure
# the repository-root .env contains POTSDAM_API_KEY and BASE_POTSDAM_LLM_URL
# before launching.
#
# 1. Check availability, pricing, request counts, and budget (no model calls):
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment preflight \
#     --config configs/runs/hidden_bench/hidden_bench_vanilla_hidden_all_tasks.yaml \
#     --output-dir results/inspection/hidden_bench_vanilla_hidden_all_tasks_preflight
#
# 2. Run all 65 cells with live console output:
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment run \
#     --config configs/runs/hidden_bench/hidden_bench_vanilla_hidden_all_tasks.yaml \
#     --output-dir results
#
# The run performs its own fresh pricing and runtime-budget checks.
llm_provider:
  type: university
  model: gwdg/qwen3-30b-a3b-instruct-2507
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 60
  max_retries: 2
  request_concurrency: 8
  temperature: 0.0
  max_output_tokens: 512
  options:
    estimated_latency_seconds: 3.0
prompt:
  schema_version: 2
  prompt_family: hidden_bench_vote
  prompt_version: 1
  message_mode: merge_consecutive_roles
  block_separator: "\n\n"
  response_contract:
    type: hidden_bench_json_vote
    # Cosmetic only: the vote's real allowed_values are bound per-task at run
    # time from each task's own possible_answers (vanilla/game.py), not from
    # this field.
    allowed_values: [Option A, Option B, Option C]
game:
  type: hidden_bench_vanilla
  population_size: 4
  # Not used by this game; set to the derived total for readability
  # (1 pre-vote + 40 discussion turns + 1 post-vote = 42 interactions, 48
  # provider calls).
  horizon: 42
  topology: complete
  options:
    task_set: vanilla
    # task_id is swept below, across all 65 canonical tasks.
    # n_agents is deliberately unset: it defaults to game.population_size.
    profile: hidden
    assignment_scheme: exact_replication
    rounds: 10 # T full round-robin passes (T*N = 40 discussion turns)
    rounds_are_speaking_turns: false
    extra_prompt: null
    dissenter_extra_prompt: null
    dissenter_fraction: 0.0
    aggregation: average
    shuffle_facts: true
    decoy: null
    invalid_response_retries: 2
    expected_validation_failure_rate: 0.0
control:
  mechanism: none
execution:
  seed: 20260811
  repetitions: 1 # episodes PER CELL; raise once the pilot run looks right
  parallelism: 4
  fail_fast: false
pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  # Sized for the whole grid (65 cells x 1 repetition), not one cell - see the
  # COST note above.
  #
  # COST is the only ceiling here. The token and request limits are
  # deliberately UNSET: their values could only ever be guesses made before
  # launch, and a wrong guess does not save money, it destroys a run. That is
  # exactly how the 50-cell reasoning-control grid died - it hit a 250M
  # `max_input_tokens` two cells in and burned its remaining 4,235 episodes on
  # refused calls (results/DIAGNOSIS.md). Unset, those counters are still
  # tracked and reported, and passing the preflight estimate logs a warning,
  # but only money can stop the run.
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 70.0
  max_cost_per_run: 70.0
  # Cross-check the guard's own arithmetic against the proxy's accounting every
  # 2 minutes. The run stops when the university reports that IT has spent
  # more than `max_cost_per_run` since launch - measured as a delta, so a
  # shared key's other traffic neither borrows from nor donates to this run.
  live_spend_poll_seconds: 120
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: true
  comet: false
  options:
    prompt_examples:
      count: 1
storage:
  output_dir: results
  format: jsonl
  checkpoints: true
  overwrite: false
analysis:
  enabled: false
  estimators: []
metrics:
  enabled: true
  available:
    population_action_share_per_option:
      comet: true
    dominant_action_share:
      comet: true
    accuracy_average:
      comet: true
    accuracy_majority:
      comet: true
    decoy_share:
      comet: true
    unshared_disclosure_rate:
      comet: true
    first_consensus_time_by_action_share:
      comet: false
    y_pre:
      comet: true
    y_post:
      comet: true
    improvement:
      comet: true
    final_unshared_disclosure_rate:
      comet: true
    agent_current_action:
      comet: false
experiment:
  name: hidden-bench-vanilla-hidden-profile-all-tasks
  description: >-
    The paper's actual protocol: each agent sees only its own private slice
    of Iu (profile: hidden), discusses for T=10 round-robin passes, then
    votes again - swept over all 65 canonical HiddenBench tasks. Paired with
    hidden_bench_vanilla_full_all_tasks.yaml (profile: full) for the Y_full
    ceiling.
  tags: [hidden-bench, vanilla, hidden-profile, all-tasks]
