# Smallest honest empowerment / mutual-information run: how much does a
# committed minority's choice of word determine which convention the
# population settles on?
#
# The quantity being estimated is I(C ; O), where
#   C = control.options.forced_value, the word agent-000 is committed to (Q or M)
#   O = the episode's terminal macrostate, i.e. the word with the largest
#       population_action_share_per_option in the final round
# plus the lagged conditional form I(C ; macrostate_{t+h} | macrostate_t).
# Both are estimated by `mas-cc analysis empowerment` over the completed grid
# directory - the MI is NOT computed during the run, and is NOT a per-episode
# quantity. It only exists across the grid's cells.
#
# Same game as naming_convention_tutorial_university_v3.yaml, resized down
# (5 agents/20 interactions -> 3 agents/15 interactions) and turned into a
# 2-cell x 3-episode grid.
#
# SAMPLE-SIZE WARNING, deliberately left in this file: 6 episodes means the
# 2x2 contingency table behind the terminal MI holds 6 counts. The point
# estimate will be dominated by the Jeffreys prior, the bootstrap CI will be
# very wide, and the permutation null will be coarse. This config is sized to
# prove the machinery works, not to support a claim. Raise
# execution.repetitions (and the budget with it) before quoting a number.
llm_provider:
  type: university
  model: gwdg/qwen3-30b-a3b-instruct-2507
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 60
  max_retries: 2
  request_concurrency: 10
  temperature: 0.0
  max_output_tokens: 128
  options:
    estimated_latency_seconds: 3.0
prompt:
  schema_version: 2
  prompt_family: naming_convention_decision
  prompt_version: 1
  message_mode: merge_consecutive_roles
  block_separator: "\n\n"
  response_contract:
    type: choice_only
    allowed_values: [Q, M]
game:
  type: naming_convention
  population_size: 3
  horizon: 15            # 15 PAIR INTERACTIONS = 5 population rounds at N=3
  topology: complete
  options:
    actions: [Q, M]
    memory_size: 3
    success_payoff: 100
    failure_payoff: -50
    pair_sampling: uniform_two_distinct
    simultaneous_pair_decisions: true
    randomize_presented_action_order: true
    prompt_contract: naming_convention_decision
    response_contract: choice_only
    parser_contract: choice_only_v1
    invalid_response_retries: 2
    expected_validation_failure_rate: 0.0
    representative_memory_size: 1
    stop_on_convergence: false
# The intervention. agent-000 of three is a committed 1/3 minority - well above
# the Ashery tipping fraction - held to one word for every interaction.
# `forced_value` here is a placeholder: the `grid:` section at the bottom sets
# it per cell, and that swept path is what becomes the MI's condition variable.
# A forced decision short-circuits the provider entirely
# (runtime/loop_runtime.py), so agent-000 never costs a request - the budget
# below is therefore conservative by roughly a third.
control:
  mechanism: forced_action
  options:
    agent_ids: [agent-000]
    forced_value: Q
    until_interaction: null   # null = committed for the whole episode
execution:
  seed: 20260805
  repetitions: 10   # episodes PER CELL -> 2 cells x 10 = 20 episodes total
  # 5 episodes in flight at once, across the whole grid. Paired with
  # simultaneous_pair_decisions (2 concurrent decisions per episode) this sits
  # exactly at llm_provider.request_concurrency: 10 - raise both together or
  # neither, otherwise the extra episodes just queue.
  parallelism: 5
  fail_fast: true
pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  # Conservative demand: 15 interactions x 2 decisions x (1 + 2 retries) = 90
  # requests per episode, x 20 episodes = 1800. Actual spend will be well under
  # that: retries only fire on invalid responses, and agent-000's decisions
  # never reach the provider at all (~1/3 of all decision slots).
  # ONE budget guard is shared by every cell and every episode in the grid -
  # these are whole-grid totals, not per-episode.
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 4.0
  max_cost_per_run: 4.0
  max_provider_requests: 2000
  max_input_tokens: 6000000
  max_output_tokens: 300000
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: true
  # false on purpose: the grid path does not wire Comet per episode, so `true`
  # here would be a config value with no effect - and an unattended upload is
  # exactly the failure mode worth not re-creating.
  comet: false
storage:
  output_dir: results
  format: jsonl
  checkpoints: true
  overwrite: false
analysis:
  enabled: false
  estimators: []
metrics:
  # Must stay true: analysis/reader.py rebuilds each episode's per-round
  # macrostate from the `population_action_share_per_option` rows in
  # metrics/streaming.csv. Turn metrics off and the MI analysis has no input.
  enabled: true
  comet_export: []
experiment:
  name: naming-convention-empowerment-pilot
  description: 2-cell (forced word Q vs M) x 10-episode empowerment pilot at N=3, H=15; smallest size at which the terminal-MI estimators start to agree.
  tags: [empowerment, mutual-information, grid, university, pilot]
grid:
  # One axis, two levels -> the binary condition variable C in I(C ; O).
  control.options.forced_value: [Q, M]
