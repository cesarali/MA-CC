# Fully expanded, self-contained example config for
# docs/howto/building/building_a_game.md - every value is written directly
# here; nothing is chased through a `component:` reference. Small (4 agents,
# 6 interactions), cheap, live against the University proxy. Not a paper
# replication and not sized for scientific results.
#
# `schema_version` is omitted everywhere it would just be the default (1) -
# see the manual for what it means. `prompt.schema_version: 2` is the one
# exception: it genuinely selects the newer prompt-component schema, not a
# leftover default, so it stays explicit.
llm_provider:
  type: university
  model: gwdg/qwen3-30b-a3b-instruct-2507
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 60
  max_retries: 2
  request_concurrency: 10
  temperature: 0.0
  max_output_tokens: 128
  options:
    estimated_latency_seconds: 3.0
prompt:
  schema_version: 2
  prompt_family: naming_convention_decision
  prompt_version: 1
  message_mode: merge_consecutive_roles
  block_separator: "\n\n"
  response_contract:
    type: choice_only # paper_choice_reason
    allowed_values: [Q, M]
game:
  type: naming_convention
  population_size: 5
  horizon: 20
  topology: complete
  options:
    actions: [Q, M]
    memory_size: 3
    success_payoff: 100
    failure_payoff: -50
    pair_sampling: uniform_two_distinct
    simultaneous_pair_decisions: true
    randomize_presented_action_order: true
    prompt_contract: naming_convention_decision
    response_contract: choice_only
    parser_contract: choice_only_v1
    invalid_response_retries: 2
    expected_validation_failure_rate: 0.0
    representative_memory_size: 1
    stop_on_convergence: false
execution:
  seed: 20260808
  repetitions: 1
  parallelism: 1
  fail_fast: true
pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  # Sized for population_size: 10, horizon: 30 above (2 decisions/interaction
  # x 30 = 60 base requests; x3 with invalid_response_retries: 2 = 180
  # conservative - was 36/6/6 x2/x3-sized for the original 4/6 tutorial size
  # and denied preflight once horizon/population_size grew without this
  # section growing to match. Re-check with `mas-cc game preflight` after
  # changing population_size/horizon again.
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 0.25
  max_cost_per_run: 0.25
  max_provider_requests: 220
  max_input_tokens: 200000
  max_output_tokens: 30000
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    # How many rounds get a full Markdown prompt example written to
    # <output-dir>/.../prompts/round_NNN.md - one file per distinct round
    # (the first decision seen in each), independent of detailed_prompt_audit
    # below. 0 (or omitting this block entirely) writes none.
    # See docs/howto/launch/running_an_episode.md section 3.
    prompt_examples:
      count: 3
storage:
  output_dir: results
  format: jsonl
  checkpoints: true
  overwrite: false
analysis:
  enabled: false
  estimators: []
metrics:
  enabled: true
  # Every metric this game computes (src/mas_cc/games/naming_convention/metrics.py's
  # METRICS), listed explicitly so this file is the answer to "what metrics
  # exist" as well as "which ones go to Comet." comet: true sends that metric's
  # population-level value to Comet every round; comet: false (or omitting a
  # metric here) keeps it local-only (still written to metrics/streaming.csv
  # and metrics/final.csv either way - that's controlled by `enabled` above,
  # not by this). agent_current_action is agent-scoped, not population-scoped,
  # so it is never sent to Comet regardless of this setting. The
  # *_per_option metrics are one metric carrying one curve per option; they
  # reach Comet as one key per option (population_action_share_per_option_Q,
  # ..._M) but are listed - and toggled - once, here.
  # See docs/howto/configuring/creating_a_game_config.md section 1.
  available:
    population_action_share_per_option:
      comet: true
    dominant_action_share:
      comet: true
    first_consensus_time_by_action_share:
      comet: true
    first_consensus_time_by_success_rate:
      comet: true
    consensus_action_by_success_rate:
      comet: false   # the winning word is a label, not a number Comet can chart
    rolling_coordination_rate:
      comet: true
    rolling_action_share_per_option:
      comet: false
    agent_current_action:
      comet: false   # agent-scoped; Comet never receives per-agent values
experiment:
  name: naming-convention-tutorial-university-walkthrough
  description: Small live N=4, H=6 example for docs/howto/building/building_a_game.md; not a paper replication, not sized for scientific results.
  tags: [tutorial, university, howto-manual]
