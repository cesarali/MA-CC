# Fully expanded, self-contained example config for
# docs/howto/building/building_a_game.md - every value is written directly
# here; nothing is chased through a `component:` reference. Small (4 agents,
# 6 interactions), cheap, live against the University proxy. Not a paper
# replication and not sized for scientific results.
#
# `schema_version` is omitted everywhere it would just be the default (1) -
# see the manual for what it means. `prompt.schema_version: 2` is the one
# exception: it genuinely selects the newer prompt-component schema, not a
# leftover default, so it stays explicit.
llm_provider:
  type: university
  model: gwdg/qwen3-30b-a3b-instruct-2507
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 60
  max_retries: 2
  request_concurrency: 10
  temperature: 0.0
  max_output_tokens: 128
  options:
    estimated_latency_seconds: 3.0
prompt:
  schema_version: 2
  prompt_family: naming_convention_decision
  prompt_version: 1
  message_mode: merge_consecutive_roles
  block_separator: "\n\n"
  response_contract:
    type: paper_choice_reason
    allowed_values: [Q, M]
game:
  type: naming_convention
  population_size: 4
  horizon: 6
  topology: complete
  options:
    actions: [Q, M]
    memory_size: 3
    success_payoff: 100
    failure_payoff: -50
    pair_sampling: uniform_two_distinct
    simultaneous_pair_decisions: true
    randomize_presented_action_order: true
    prompt_contract: naming_convention_decision
    response_contract: json_reason
    parser_contract: tolerant_paper_object_v1
    invalid_response_retries: 2
    expected_validation_failure_rate: 0.0
    representative_memory_size: 1
    stop_on_convergence: false
execution:
  seed: 20260803
  repetitions: 1
  parallelism: 1
  fail_fast: true
pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 0.25
  max_cost_per_run: 0.25
  max_provider_requests: 36
  max_input_tokens: 200000
  max_output_tokens: 20000
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
storage:
  output_dir: results
  format: jsonl
  checkpoints: true
  overwrite: false
analysis:
  enabled: false
  estimators: []
metrics:
  enabled: true
  comet_export: []
experiment:
  name: naming-convention-tutorial-university-walkthrough
  description: Small live N=4, H=6 example for docs/howto/building/building_a_game.md; not a paper replication, not sized for scientific results.
  tags: [tutorial, university, howto-manual]
