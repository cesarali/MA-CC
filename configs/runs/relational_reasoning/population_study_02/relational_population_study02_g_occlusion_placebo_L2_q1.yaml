# Relational reasoning — population study 02, arm G: OCCLUSION PLACEBO
#
# ---------------------------------------------------------------------------
# WHAT THIS ARM IS FOR
#
# Arm E shows what a budgeted adversarial controller does to a population. It
# does two things at once, and they are confounded in every cell:
#
#   1. it TAKES AWAY a peer - the controlled focal loses one of its q social
#      slots to the controller and never hears that peer's vote or fact;
#   2. it PUSHES - what occupies the slot recommends a specific wrong relation.
#
# This arm runs (1) without (2). A controlled position still consumes the same
# peer slot on the same schedule, but the slot is left EMPTY: no vote, no
# recommendation, no evidence, no substitute participant. The difference
# between arm E and arm G at the same b is the directional part of the effect;
# what arm G moves on its own is the cost of lost peer information.
#
# Deliberately NOT a random or neutral vote in the slot. Anything that votes is
# a new social field - a fifth participant whose opinion is uniform noise is an
# intervention in its own right, not the absence of one. Occlusion is the only
# manipulation here.
#
# Derived from
#   configs/runs/relational_reasoning/population_study_02/
#     relational_population_study02_e_wrong_budget_scan_L2_q1.yaml
#
# Everything else is arm E byte-for-byte: provider, prompt family and version,
# game, dataset, r, q, rounds, repetitions, execution.seed, sensor, policy,
# threshold, beta, advocacy_schedule, budget guard, `results_only` artifact
# profile, metrics and observables. Two fields differ:
#
#   1. control.options.message_mode: recommendation_only -> silent
#   2. only b in {12, 18} is launched (c = 0.50, 0.75), the two budgets where
#      arm E has the most room to show a directional effect.
#
# THE CODE THIS NEEDED
#
# `message_mode: silent` did not exist; the controller had only
# `recommendation_only` and `recommendation_plus_fact`. It was added as the
# minimal way to express occlusion:
#
#   * controller.py     new mode `silent`; `transmits_recommendation` is False
#                       for it, and it rejects a configured fact citation.
#   * runtime.py        `build_social_sources(controller_transmits=False)`
#                       omits the controlled slot instead of substituting one.
#                       Every seeded stream is drawn exactly as before, so the
#                       occluded positions are the positions arm E advocated at.
#   * prompts.py        a third decision-basis text for a focal update with no
#                       visible participants. Without it an occluded update
#                       would fall back to the round-0 text, which asserts that
#                       "no other participant has stated a position yet" - false
#                       mid-episode, and a confound of its own. The block is
#                       `dynamic`, so the prompt definition, version and hash
#                       are unchanged and arm E's prompts are untouched.
#
# Tests: tests/mas_cc/test_relational_imitation_round_feedback.py, the
# "occlusion placebo" section - a controlled slot removes the peer, adds no
# source, renders no vote/recommendation/evidence, exposes no controller fact,
# and occludes on exactly arm E's schedule from the same seed.
#
# PAIRING WITH ARM E
#
# execution.seed and the grid axes are identical to arm E, and the launcher
# submits cell indices 2..5, so each episode here has the same episode seed as
# the arm E episode it is compared with. That fixes the initial local votes,
# the focal/peer sampling, the controlled schedule and the replaced slot
# positions: the two arms differ only in what the vacated slot contained.
# Peer sampling is drawn from the seeded stream rather than from population
# state, so the pairing survives the point where the two trajectories diverge.
#
# EXPECTED SHAPE
#
#   4 cells launched (indices 2,3,4,5) x 2 repetitions = 8 episodes
#   264 nominal provider calls per episode = 24 initial votes + 24 x 10 updates
#   2,112 nominal calls, ~2,230 with the 5% validation-failure allowance
#
# Realized controlled positions must be exactly b per round (advocacy_schedule
# is `always`, so every round actuates): 12 for cells 2-3, 18 for cells 4-5.
# ---------------------------------------------------------------------------

llm_provider:
  type: university
  model: gwdg/openai-gpt-oss-120b
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 8
  temperature: 0.0
  # gpt-oss is a reasoning model: `reasoning_content` and the answer are both
  # charged against max_tokens, and below roughly 1k the answer is truncated
  # away and `content` arrives empty. Not a cost dial - the budget guard settles
  # reservations against actual usage. Bound spend with budget.max_cost_per_run.
  max_output_tokens: 4096
  options:
    estimated_latency_seconds: 10.0

prompt:
  schema_version: 2
  prompt_family: relational_public_ballot
  prompt_version: 1
  response_contract:
    type: relational_public_ballot
    # The letters a call presents. Which relation each names is shuffled per
    # call; the population state is the relation, never the letter.
    allowed_values: [A, B, C]

game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 10
  topology: complete
  options:
    # Fixed, not swept: this study holds r = 6 and varies the control budget.
    task_dataset_dir: src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r06
    task_id: task_0001
    dynamics_mode: reasoning
    rounds: 10
    social_group_size: 1
    vote_visibility: public
    prompt_version: 1
    social_distrust: true
    stop_on_consensus: false
    invalid_response_retries: 1
    expected_validation_failure_rate: 0.05
    initialization:
      # Each agent decides once from K_i(0) alone, so the starting population
      # reflects the distributed-information problem rather than a coin flip.
      mode: local_vote

control:
  mechanism: relational_round_budgeted
  options:
    # RECORDED, NEVER TRANSMITTED under `message_mode: silent`. The target is
    # kept identical to arm E for two reasons: the controller's decision path
    # and its seeded streams stay byte-identical to the arm this is matched to,
    # and `controller_target_share` / `analysis_target` keep measuring the same
    # relation, so the placebo reads as the counterfactual of the same column.
    # Verified incorrect for task_0001 (EAST) and task_0002 (SOUTH).
    target: 2
    sensor_sample_size: 24
    policy: soft_target
    threshold: 0.5
    beta: 4.0
    # Swept below. Only b = 12 and b = 18 are launched - see the grid note.
    intervention_budget: 6
    advocacy_schedule: always
    # THE ONE DIFFERENCE FROM ARM E. `silent` vacates the controlled slot
    # instead of filling it: the focal loses that peer and is shown nothing in
    # its place - no vote, no recommendation, no fact, no substitute speaker.
    message_mode: silent

execution:
  seed: 20260819
  repetitions: 2
  parallelism: 8
  fail_fast: false

pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false

budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 300.0
  max_cost_per_run: 300.0
  max_provider_requests: 200000
  max_input_tokens: 1000000000
  max_output_tokens: 100000000
  allow_unbounded_paid_requests: false

logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    prompt_examples:
      count: 1
      scope: cell

storage:
  output_dir: results
  format: jsonl
  # Compact, exactly as in study 01: the microscopic trajectory.jsonl, the
  # per-episode events/logs/audit and the streaming metric CSVs are dropped at
  # cell completion. What survives is the per-round scientific channel -
  # round_records/<episode>/round_trajectory.jsonl - plus the compact
  # scientific table, the cell aggregate, one prompt example per cell and the
  # resolved config.
  artifact_profile: results_only
  checkpoint_mode: episode
  overwrite: false

analysis:
  # Deliberately off, as in study 01: the configured estimators are
  # HiddenBench-specific, and this study's analysis (kappa_t, phi_t, p_truth,
  # controller_target_share) is read straight off round_trajectory.jsonl.
  enabled: false

metrics:
  enabled: true
  comet_export: []

aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order, dominant_action_share]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0

observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 25
    sweep_experiment: true
    cell_reporting: master
    metric_plots: true

experiment:
  name: relational-study02-g-occlusion-placebo
  description: >-
    Relational reasoning population study 02, arm G: occlusion-matched placebo
    for the arm E budget scan. N=24, L=2, r=6, q=1, 10 rounds. The controlled
    slots are vacated rather than filled (message_mode: silent), so the focal
    loses a peer-information opportunity and receives no directional
    recommendation. b in [12,18] over the same 2 matched worlds as arm E.
  tags:
    [relational, population-study-02, arm-g, N24, q1, r6, occlusion, placebo,
     silent-control]
  metadata:
    study: population_study_02
    arm: "G"
    role: occlusion_placebo_for_arm_E
    population_rounds: 10
    social_group_size: 1
    support_redundancy: 6
    reasoning_depth: 2
    worlds: 2
    repetitions: 2
    control_budgets: [12, 18]
    control_fractions: [0.5, 0.75]
    target_selection: fixed_option_index_2_recorded_not_transmitted
    message_mode: silent
    paired_with: relational_population_study02_e_wrong_budget_scan_L2_q1.yaml
    paired_cell_indices: [2, 3, 4, 5]
    launched_cell_indices: [2, 3, 4, 5]

# The b axis deliberately still carries 6, which THIS STUDY DOES NOT RUN.
#
# The episode seed is derived from the grid CELL INDEX
# (orchestrator.py:2124-2132: Seed(execution.seed).derive("grid-cell:{i}")
# .derive("episode:{j}")), so a cell only reproduces arm E's episode seeds if
# it sits at arm E's index. Dropping b = 6 would renumber every cell and break
# the pairing this placebo exists to have. Keeping the axis identical costs
# nothing - the launcher submits cell indices 2..5 and never instantiates 0..1.
#
#   index  b   c     world       launched
#   ------------------------------------------------
#     0     6  0.25  task_0001   no - alignment only
#     1     6  0.25  task_0002   no - alignment only
#     2    12  0.50  task_0001   YES
#     3    12  0.50  task_0002   YES
#     4    18  0.75  task_0001   YES
#     5    18  0.75  task_0002   YES
#
# 4 cells launched x 2 repetitions = 8 episodes.
grid:
  control.options.intervention_budget:
    - 6
    - 12
    - 18
  game.options.task_id:
    - task_0001
    - task_0002
