# Study 08 DeepInfra/Gemma production-like smoke.
# Fixed representative truth-control cell: N=24, q=1, q_c=12, theta=0.5,
# beta=4, budget=12, vigilant receiver, neutral evidence, task_0001, ten rounds.
# Shape: one scientific cell x one episode. Calls: 264 nominal, 279 expected,
# 1,584 conservative.

llm_provider:
  type: deepinfra
  model: google/gemma-4-E4B-it
  credentials_env: DEEPINFRA_API_KEY
  timeout_seconds: 120
  max_retries: 8
  # One episode can resolve all 24 agent decisions in a round concurrently.
  # The account reports 200 outstanding requests/model and 1.1M tokens/minute.
  request_concurrency: 24
  temperature: 0.0
  max_output_tokens: 4096
  options:
    estimated_latency_seconds: 5.0

prompt:
  schema_version: 2
  prompt_family: relational_public_ballot
  prompt_version: 1
  response_contract:
    type: relational_public_ballot
    allowed_values: [A, B, C]

game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 10
  topology: complete
  options:
    task_dataset_dir: src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r06
    task_id: task_0001
    dynamics_mode: reasoning
    rounds: 10
    social_group_size: 1
    vote_visibility: public
    prompt_version: 1
    receiver_epistemic_disposition: vigilant
    stop_on_consensus: false
    # A production study contains more than half a million expected decisions.
    # At the declared 5% validation-failure rate, two attempts make at least
    # one terminal malformed-response failure effectively certain. Six total
    # attempts reduce that study-wide risk below one percent while leaving the
    # expected-attempt estimate (1 / 0.95) unchanged.
    invalid_response_retries: 5
    max_reason_characters: 16384
    expected_validation_failure_rate: 0.05
    initialization:
      mode: local_vote

control:
  mechanism: relational_round_budgeted
  options:
    # Existing supported mechanism: resolve the ground-truth option per task.
    target: correct
    sensor_sample_size: 12
    policy: soft_target
    threshold: 0.5
    beta: 4.0
    intervention_budget: 12
    advocacy_schedule: soft
    message_mode: recommendation_plus_fact
    controller_evidence_strategy: neutral

execution:
  seed: 20260822
  repetitions: 1
  parallelism: 1
  fail_fast: false

pricing:
  mode: offline
  require_fresh_at_launch: false
  fallback_policy: deny
  explicit_unknown_price_override: false

budget:
  accounting_unit: USD
  system_max_cost_per_run: 25.0
  max_cost_per_run: 25.0
  max_provider_requests: 2000
  max_input_tokens: 20000000
  max_output_tokens: 7000000
  allow_unbounded_paid_requests: false

logging:
  level: INFO
  console: true
  audit: true
  comet: false
  options:
    comet_project: mas-cc
    prompt_examples:
      # A failed production-shaped smoke must retain every bounded attempt so
      # provider/model contract failures are diagnosable without changing the
      # results-only production artifact profile.
      count: 100
      scope: cell
    detailed_prompt_audit:
      # Keep provider replies that fail the game contract. Merely selecting the
      # full artifact profile does not enable detailed prompt auditing.
      enabled: true
      always_log_first_n_rounds: 0
      max_logged_prompts_per_game: 20
      max_logged_prompts_per_run: 20

storage:
  output_dir: /pscratch/sd/d/dfarough/MA-CC-results/deepinfra-gemma-study08-smoke
  format: jsonl
  # The production study uses results_only. This single diagnostic episode
  # deliberately keeps the full invalid-response audit so a cheaper model can
  # be rejected before it corrupts or stalls a 1,920-episode study.
  artifact_profile: full
  checkpoint_mode: episode
  overwrite: false

# Study aggregation performs the predeclared offline estimator pass over pooled
# canonical observations. Avoid duplicating the same expensive bootstrap here.
analysis:
  enabled: false
  estimators: []

metrics:
  enabled: true
  comet_export: []

aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order, dominant_action_share]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0

observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 25
    sweep_experiment: true
    cell_reporting: master
    metric_plots: true

experiment:
  name: relational-study08-truth-prompt-b-atlas-deepinfra-gemma-smoke
  description: >-
    Study 08 production-like truth-control smoke at N=24, q=1, q_c=12,
    theta=0.5, beta=4 for one fixed cell and one Gemma episode.
  tags: [relational, population-study-08, truth-aligned, prompt-class, b-atlas, N24, q1, qc12, beta4, deepinfra, gemma-4-e4b-it, smoke, diagnostic]
  metadata:
    study: population_study_08
    phase: truth_prompt_atlas_smoke
    design: epistemic_prompt_control_efficiency
    controller_semantics: truth
    target_semantics: truth
    controller_target: correct
    population_rounds: 10
    social_group_size: 1
    sensor_sample_size: 12
    sensing_fraction: 0.5
    beta: 4.0
    worlds: 1
    repetitions: 1
    cells: 1
    episodes: 1
    llm_provider: deepinfra
    llm_model: google/gemma-4-E4B-it
    nominal_provider_requests: 264
    expected_provider_requests: 279
    conservative_provider_requests: 1584
    common_random_numbers_across_grid: false
    crn_note: single-cell provider smoke; the production variant preserves the original paired grid and root seed
    mandatory_message_mode: recommendation_plus_fact
    # Names what the offline analysis genuinely computes, in the coordinates of
    # the revised single-affinity theory. `round_target_susceptibility` is the
    # canonical chi (target FRACTION, state matched on target_count_before);
    # the magnetization response and the marginal share response remain
    # available as diagnostics but are not this family.
    primary_analysis_family:
      - round_target_susceptibility
      - round_target_actuation_cmi
      - eta_ir
      - effective_affinity
      - kinetic_compliance
      - controlled_current
      - target_sensing_information_nats
      - eta_th
      - round_memory_target_actuation_cmi
