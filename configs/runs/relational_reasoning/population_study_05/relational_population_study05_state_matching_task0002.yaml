# Study 05 state-matched one-round intervention, world task_0002.
# Pair with task0001.yaml for the complete 120-episode pilot.

llm_provider:
  type: university
  model: gwdg/openai-gpt-oss-120b
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 8
  temperature: 0.0
  max_output_tokens: 4096
  options: {estimated_latency_seconds: 10.0}

prompt:
  schema_version: 2
  prompt_family: relational_public_ballot
  prompt_version: 1
  response_contract: {type: relational_public_ballot, allowed_values: [A, B, C]}

game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 1
  topology: complete
  options:
    task_dataset_dir: src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r06
    task_id: task_0002
    dynamics_mode: reasoning
    rounds: 1
    social_group_size: 1
    vote_visibility: public
    prompt_version: 1
    social_distrust: true
    stop_on_consensus: false
    invalid_response_retries: 1
    expected_validation_failure_rate: 0.05
    initialization:
      mode: explicit
      initial_votes: &votes6 [SOUTHWEST, SOUTH, SOUTHWEST, SOUTH, SOUTHWEST, SOUTHWEST, SOUTHWEST, SOUTH, SOUTHWEST, SOUTHWEST, SOUTHWEST, SOUTHWEST, SOUTHWEST, SOUTHWEST, SOUTHWEST, SOUTHWEST, SOUTH, SOUTHWEST, SOUTHWEST, SOUTH, SOUTHWEST, SOUTH, SOUTHWEST, SOUTHWEST]

control:
  mechanism: relational_round_budgeted
  options:
    target: 2                 # SOUTH, incorrect
    sensor_sample_size: 18
    policy: soft_target
    threshold: 0.5
    beta: 4.0
    intervention_budget: 18
    advocacy_schedule: always
    message_mode: recommendation_only

execution: {seed: 20260821, repetitions: 10, parallelism: 8, fail_fast: false}

pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false

budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 300.0
  max_cost_per_run: 300.0
  max_provider_requests: 3000
  max_input_tokens: 100000000
  max_output_tokens: 10000000
  allow_unbounded_paid_requests: false

logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    prompt_examples: {count: 1, scope: cell}

storage: {output_dir: results, format: jsonl, artifact_profile: results_only, checkpoint_mode: episode, overwrite: false}
analysis: {enabled: false}
metrics: {enabled: true, comet_export: []}

aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order, dominant_action_share]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0

observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 25
    sweep_experiment: true
    cell_reporting: master
    metric_plots: true

experiment:
  name: relational-study05-state-matching-task0002
  description: One-round matched initial-target-support intervention for task_0002.
  tags: [relational, population-study-05, state-matching, N24, one-round]
  metadata:
    study: population_study_05
    design: state_matched_intervention
    common_random_numbers_across_grid: true
    task_id: task_0002
    target_relation: SOUTH
    n_z_0: [6, 9, 12]
    action_arms: [always, never]
    repetitions: 10
    cells: 6
    episodes: 60

grid:
  game.options.initialization.initial_votes:
    - *votes6
    - &votes9 [SOUTH, SOUTH, SOUTHWEST, SOUTH, SOUTHWEST, SOUTHWEST, SOUTHWEST, SOUTH, SOUTHWEST, SOUTHWEST, SOUTHWEST, SOUTHWEST, SOUTH, SOUTHWEST, SOUTHWEST, SOUTH, SOUTH, SOUTHWEST, SOUTHWEST, SOUTH, SOUTHWEST, SOUTH, SOUTHWEST, SOUTHWEST]
    - &votes12 [SOUTH, SOUTH, SOUTHWEST, SOUTH, SOUTHWEST, SOUTHWEST, SOUTHWEST, SOUTH, SOUTHWEST, SOUTH, SOUTHWEST, SOUTH, SOUTH, SOUTHWEST, SOUTHWEST, SOUTH, SOUTH, SOUTHWEST, SOUTHWEST, SOUTH, SOUTHWEST, SOUTH, SOUTHWEST, SOUTH]
  control.options.advocacy_schedule: [always, never]
