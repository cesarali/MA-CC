llm_provider:
  type: university
  model: gwdg/openai-gpt-oss-120b
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 2
  temperature: 1.0
  max_output_tokens: 512
  options: {estimated_latency_seconds: 10.0}
prompt: {schema_version: 2, prompt_family: relational_blackboard_ballot, prompt_version: 4, response_contract: {type: relational_blackboard_ballot, allowed_values: [A, B, C]}}
game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 3
  topology: complete
  options:
    task_family: musr_team_allocation
    task_dataset_dir: results/studies/musr_truthful_selective_task_calibration_01/tasks
    task_id: task_003
    dynamics_mode: reasoning
    rounds: 3
    social_group_size: 3
    social_mode: board
    board: {sampling: uniform, message_lifetime_rounds: 1, exclude_self_authored: true, allow_no_post: true, allow_participant_requests: true}
    epistemic_persistence: 0.925
    vote_visibility: public
    prompt_version: 4
    receiver_epistemic_disposition: vigilant
    stop_on_consensus: false
    invalid_response_retries: 2
    expected_validation_failure_rate: 0.10
    initialization:
      mode: paired_local_vote
      artifact_dir: /work/ojedamarin/Projects/LanguageGames/MA-CC/results/studies/astra_phase1_task003_smoke_initializations
      require_artifact: true
control:
  mechanism: relational_round_budgeted
  options:
    target: ALLOCATION_2
    sensor_sample_size: 12
    policy: soft_target
    threshold: 0.50
    beta: 4.0
    intervention_budget: 6
    advocacy_schedule: soft
    message_mode: recommendation_only
    controller_actuation_mode: adaptive_communication
    controller_timing: dawn_only
    allow_controller_requests: true
    allow_controller_directives: true
    controller_communication_policy: contextual_weighted_v1
    controller_communication_policy_version: 1
    controller_report_cooldown_rounds: 1
    controller_report_max_posts_per_fact: 3
    controller_report_selection_strategy: target_preserving_v1
execution: {seed: 20260907, repetitions: 1, parallelism: 1, fail_fast: true}
pricing: {mode: offline, require_fresh_at_launch: false, fallback_policy: deny, explicit_unknown_price_override: true}
budget: {accounting_unit: proxy_accounting_unit, system_max_cost_per_run: null, max_cost_per_run: 20.0, max_provider_requests: 240, max_input_tokens: 3000000, max_output_tokens: 500000, allow_unbounded_paid_requests: false}
logging: {level: INFO, console: true, audit: true, comet: false}
storage: {output_dir: results, format: jsonl, artifact_profile: full, checkpoint_mode: episode, overwrite: false}
analysis: {enabled: false, estimators: []}
metrics: {enabled: true, comet_export: []}
observability: {schema_version: 1, comet: {writer: master_only, heartbeat_seconds: 20, progress_metrics: [episodes_done], grid_image_every_n_episodes: 1, sweep_experiment: false, cell_reporting: master, metric_plots: false}}
experiment:
