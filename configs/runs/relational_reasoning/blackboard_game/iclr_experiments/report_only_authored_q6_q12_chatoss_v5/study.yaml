study:
  name: report_only_authored_q6_q12_chatoss_v5
configs:
- no_control_q6.yaml
- false_control_q6.yaml
- truth_control_q6.yaml
- no_control_q12.yaml
- false_control_q12.yaml
- truth_control_q12.yaml
execution:
  mode: auto
  cells_per_shard: 1
  target_rpm: 500
  assumed_latency_seconds: 90.0
  max_active_nodes: 6
  throttle: 6
  cpus_per_task: 8
  memory: 12G
  time_limit: '36:00:00'
  partition: main
  results_root: /shared/home/cesar/work/results/studies/report_only_authored_q6_q12_chatoss_v5
  require_results_under: /shared/home/cesar/work/results
  provider_load_control:
    mode: redis_adaptive
    initial_concurrency: 150
    minimum_concurrency: 25
    maximum_concurrency: 150
    target_rpm: 500
    lease_seconds: 180
    heartbeat_seconds: 60
    retry_max_elapsed_seconds: 1800
    admission_max_elapsed_seconds: 1800
    global_min_samples: 12
    global_failure_ratio: 0.25
    decrease_factor: 0.5
    increase_step: 2
    increase_interval_seconds: 60
analysis:
  recipe: analysis.yaml
