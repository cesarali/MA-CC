llm_provider:
  type: deepinfra
  model: openai/gpt-oss-120b
  credentials_env: DEEPINFRA_API_KEY
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 10
  temperature: 1.0
  max_output_tokens: 4096
  options:
    estimated_latency_seconds: 15.0
    reasoning_effort: low
prompt:
  schema_version: 2
  prompt_family: relational_blackboard_ballot
  prompt_version: 5
  response_contract:
    type: relational_blackboard_ballot
    allowed_values: [A, B, C]
game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 15
  topology: complete
  options:
    task_family: musr_team_allocation
    task_dataset_dir: /shared/home/cesar/work/results/studies/musr_truthful_selective_task_calibration_01/tasks
    task_id: task_003
    dynamics_mode: reasoning
    rounds: 15
    social_group_size: 12
    social_mode: board
    board:
      sampling: uniform
      message_lifetime_rounds: 1
      exclude_self_authored: true
      allow_no_post: true
      communication_profile: report_only
      require_grounded_reports: true
      report_citation_scope: active_or_observed
      no_citable_fact_action: none
    epistemic_persistence: 0.75
    vote_visibility: public
    prompt_version: 5
    receiver_epistemic_disposition: vigilant
    stop_on_consensus: false
    invalid_response_retries: 4
    expected_validation_failure_rate: 0.15
    initialization:
      mode: paired_local_vote
      artifact_dir: /shared/home/cesar/work/results/studies/21-09-2026-full-vs-report-v1_initializations
      require_artifact: true
control:
  mechanism: none
  options: {}
execution:
  seed: 20260907
  repetitions: 60
  parallelism: 5
  fail_fast: false
  semantic_failure_guard:
    minimum_finished_episodes: 2
    maximum_failure_fraction: 0.25
    minimum_failures: 2
pricing:
  mode: offline
  require_fresh_at_launch: false
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  accounting_unit: USD
  system_max_cost_per_run: 1500.0
  max_cost_per_run: 1500.0
  max_provider_requests: 3000000
  max_input_tokens: 2000000000
  max_output_tokens: 8000000000
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    prompt_examples:
      count: 3
      scope: cell
storage:
  output_dir: results
  format: jsonl
  artifact_profile: dashboard_semantic
  checkpoint_mode: episode
  overwrite: false
analysis:
  enabled: false
  estimators: []
metrics:
  enabled: true
  comet_export: []
observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 1
    sweep_experiment: true
    cell_reporting: master
    metric_plots: true
experiment:
  name: 21-09-2026-full-vs-report-v1-no-control
  description: Task-003 q=12 autonomous baselines for report-only and full communication.
  tags:
  - iclr-experiments
  - musr
  - blackboard
  - task003
  - no-control
  - q12
  - deepinfra
  - gpt-oss-120b
  - communication-profile-comparison
  - prompt-v5
  metadata:
    study: 21-09-2026-full-vs-report-v1
    arm: no_control
    task_id: task_003
    candidate_id: 130
    task_file_sha256: 1ec61ccc9578e2bcbd6a027035231dcd1ee39d44892d95b8b6ae2e9f18fdfbdb
