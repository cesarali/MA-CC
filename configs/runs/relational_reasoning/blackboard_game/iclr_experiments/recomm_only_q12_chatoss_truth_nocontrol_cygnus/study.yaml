# Cygnus run of the ICLR truth-control + no-control arms (operator ask 2026-09-18/19).
# Truth control: budgets {6, 9, 12, 15, 18} x rho {0.70, 0.85, 1.00} = 15 cells; no control: rho only = 3 cells.
# 18 cells x 60 repetitions = 1,080 episodes. Same task-003 artifacts, paired seeds (the 60-file bank from Cesar),
# openai/gpt-oss-120b reasoning_effort low via the gateway batch pool, redis_adaptive coordinator.
# PREPARED ONLY — submit is operator-gated (spend). Launcher: scripts/Cygnus/SLURM/run_study_cell_array.job.
study: {name: recomm_only_q12_chatoss_truth_nocontrol_cygnus}
configs: [no_control.yaml, truth_control.yaml]
execution:
  mode: auto
  cells_per_shard: 1
  target_rpm: 12000
  assumed_latency_seconds: 6.0
  max_active_nodes: 6
  throttle: 6
  cpus_per_task: 8
  memory: 12G
  time_limit: "36:00:00"
  partition: main
  results_root: /shared/home/todie/MA-CC/results/studies/recomm_only_q12_chatoss_truth_nocontrol_cygnus
  require_results_under: /shared/home/todie/MA-CC/results
  # DeepInfra estate account: 400 concurrent measured. throttle 6 shards x 60 = 360 in flight, same as job 24.
  provider_load_control: {mode: redis_adaptive, initial_concurrency: 360, minimum_concurrency: 25, maximum_concurrency: 400, target_rpm: 12000, lease_seconds: 180, heartbeat_seconds: 60, retry_max_elapsed_seconds: 1800, admission_max_elapsed_seconds: 1800, global_min_samples: 12, global_failure_ratio: 0.25, decrease_factor: 0.5, increase_step: 10, increase_interval_seconds: 60}
analysis: {recipe: analysis.yaml}
