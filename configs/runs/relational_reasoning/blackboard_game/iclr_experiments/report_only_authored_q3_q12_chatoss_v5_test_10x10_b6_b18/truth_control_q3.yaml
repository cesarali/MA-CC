llm_provider:
  type: deepinfra
  model: openai/gpt-oss-120b
  credentials_env: DEEPINFRA_API_KEY
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 10
  temperature: 1.0
  max_output_tokens: 4096
  options:
    estimated_latency_seconds: 90.0
    reasoning_effort: low
prompt:
  schema_version: 2
  prompt_family: relational_blackboard_ballot
  prompt_version: 5
  response_contract:
    type: relational_blackboard_ballot
    allowed_values:
    - A
    - B
    - C
game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 10
  topology: complete
  options:
    task_family: musr_team_allocation
    task_dataset_dir: /shared/home/cesar/work/results/studies/musr_truthful_selective_task_calibration_01/tasks
    task_id: task_003
    dynamics_mode: reasoning
    rounds: 10
    social_group_size: 3
    social_mode: board
    board:
      sampling: uniform
      message_lifetime_rounds: 1
      exclude_self_authored: true
      allow_no_post: true
      allow_participant_requests: false
      require_grounded_reports: true
      report_citation_scope: active_or_observed
      no_citable_fact_action: none
    epistemic_persistence: 0.7
    vote_visibility: public
    prompt_version: 5
    receiver_epistemic_disposition: vigilant
    stop_on_consensus: false
    invalid_response_retries: 4
    expected_validation_failure_rate: 0.15
    initialization:
      mode: paired_local_vote
      artifact_dir: /shared/home/cesar/work/results/studies/report_only_authored_q3_q12_chatoss_v5_test_10x10_b6_b18_initializations
      require_artifact: true
control:
  mechanism: relational_round_budgeted
  options:
    target: correct
    sensor_sample_size: 3
    policy: soft_target
    threshold: 0.5
    beta: 4.0
    intervention_budget: 6
    advocacy_schedule: soft
    message_mode: recommendation_only
    controller_actuation_mode: adaptive_communication
    controller_timing: dawn_only
    allow_controller_requests: false
    allow_controller_directives: false
    controller_communication_policy: llm_authored_report_only_v1
    controller_communication_policy_version: 1
    controller_communication_fallback_policy: contextual_weighted_v1
    controller_communication_max_retries: 2
    controller_report_cooldown_rounds: 1
    controller_report_max_posts_per_fact: 3
    controller_report_selection_strategy: target_preserving_v1
execution:
  seed: 20260907
  repetitions: 10
  parallelism: 10
  fail_fast: false
  semantic_failure_guard:
    minimum_finished_episodes: 2
    maximum_failure_fraction: 0.25
    minimum_failures: 2
pricing:
  mode: offline
  require_fresh_at_launch: false
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  accounting_unit: USD
  system_max_cost_per_run: 1500.0
  max_cost_per_run: 1500.0
  max_provider_requests: 3000000
  max_input_tokens: 2000000000
  max_output_tokens: 8000000000
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    prompt_examples:
      count: 3
      scope: cell
storage:
  output_dir: results
  format: jsonl
  artifact_profile: dashboard_semantic
  checkpoint_mode: episode
  overwrite: false
analysis:
  enabled: false
  estimators: []
metrics:
