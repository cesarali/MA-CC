llm_provider:
  type: deepinfra
  model: openai/gpt-oss-120b
  credentials_env: DEEPINFRA_API_KEY
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 10
  temperature: 1.0
  max_output_tokens: 4096
  options:
    estimated_latency_seconds: 15.0
    reasoning_effort: low
prompt:
  schema_version: 2
  prompt_family: relational_blackboard_ballot
  prompt_version: 5
  response_contract:
    type: relational_blackboard_ballot
    allowed_values:
    - A
    - B
    - C
game:
  type: relational_imitation_round_feedback
  population_size: 15
  horizon: 30
  topology: complete
  options:
    task_family: musr_team_allocation
    task_dataset_dir: /shared/MA-CC/results/studies/musr_truthful_selective_task_calibration_01/tasks
    task_id: task_004
    dynamics_mode: reasoning
    rounds: 30
    social_group_size: 7
    social_mode: board
    board:
      sampling: uniform
      message_lifetime_rounds: 1
      exclude_self_authored: true
      allow_no_post: true
      communication_profile: full_communication
      require_grounded_reports: true
      report_citation_scope: active_or_observed
      no_citable_fact_action: none
    epistemic_persistence: 1.0
    vote_visibility: public
    prompt_version: 5
    receiver_epistemic_disposition: vigilant
    stop_on_consensus: false
    invalid_response_retries: 4
    expected_validation_failure_rate: 0.15
    initialization:
      mode: paired_local_vote
      artifact_dir: /shared/MA-CC-results/24-09-2026-task004-rho1_initializations
      require_artifact: true
control:
  mechanism: relational_round_budgeted
  options:
    target: ALLOCATION_2
    sensor_sample_size: 100
    sensing_mode: board
    policy: soft_target
    threshold: 0.5
    beta: 4.0
    intervention_budget: 90
    controller_budget_scope: episode
    advocacy_schedule: always
    message_mode: recommendation_only
    controller_actuation_mode: adaptive_communication
    controller_timing: dawn_only
    controller_authoring: llm_authored
    controller_memory_mode: none
    controller_fact_pool_mode: balanced
    controller_communication_max_retries: 2
    controller_report_cooldown_rounds: 0
    controller_report_max_posts_per_fact: 90
    controller_report_selection_strategy: target_preserving_v1
execution:
  seed: 20260907
  repetitions: 10
  parallelism: 10
  fail_fast: true
pricing:
  mode: offline
  require_fresh_at_launch: false
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  accounting_unit: USD
  system_max_cost_per_run: 25.0
  max_cost_per_run: 25.0
  max_provider_requests: 3000000
  max_input_tokens: 2000000000
  max_output_tokens: 8000000000
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: true
  comet: false
  options:
    comet_project: mas-cc
    prompt_examples:
      count: 200
      scope: episode
storage:
  output_dir: results
  format: jsonl
  artifact_profile: full
  checkpoint_mode: episode
  overwrite: true
analysis:
  enabled: false
  estimators: []
metrics:
  enabled: true
  comet_export: []
observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics:
    - episodes_done
    sweep_experiment: false
    cell_reporting: master
    metric_plots: false
experiment:
  name: task004_false_balanced_b90_full_rho1
  description: 'Ten task_004 false-target episodes at rho=1.0 under full communication with a 90-post
    episode budget. The controller''s menu is the balanced pool: 27 true non-decisive facts, 9 leaning
    to each allocation, strength-matched. Identical to the pilot arm task004_allfacts_b90_full_communication_suite/false_allfacts_rho1.yaml
    except for the pool and paired initializations.'
  tags:
  - iclr-experiments
  - musr
  - blackboard
  - task004
  - false-control
  - q7
  - rounds30
  - prompts-retained
  - deepinfra
  - gpt-oss-120b
  - communication-profile-comparison
  - full-communication
  - prompt-v5
  - markovian-controller
  - b90
  - balanced-pool
  metadata:
    study: 28-09-2026-task004-false-balanced-pool
    arm: false_balanced_b90_full_rho1
    task_id: task_004
    candidate_id: 130
    task_file_sha256: 333a6fb173d77ecffed856e35aa0be2a0991fb283e8c350468c6c97f7281f30f
    private_assignment_sha256: 987808df2048b3262a8806e72f8100ff7e836e646d2b1d4d0c6a5d638daf44ba
    controller_pool_ids_sha256: ae28ad8a89134f87be6095819fc43ba224602a98390020b790f17c17becd60f5
    controller_pool_mode: balanced
    controller_pool_size: 27
    excluded_decisive_fact_count: 6
    ground_truth: ALLOCATION_0
    controller_target: ALLOCATION_2
    controller_target_is_truth: false
    target_semantics: false
    sensor_sample_size: 100
    intervention_budget: 90
    controller_budget_scope: episode
    controller_memory_mode: none
    epistemic_persistence: 1.0
    controller_sees_task_context: true
    controller_context_note: The controller receives the scenario, the question and all three allocation
      meanings. v0/v1 controllers received none of these and were told to push a label they could not
      interpret.
    population_size: 15
    population_rounds: 30
    social_group_size: 7
    repetitions: 10
    common_random_numbers_across_grid: true
    paired_initialization_across_grid: true
    paired_initialization_across_targets: true
    controller_pool_lean_counts:
      ALLOCATION_0: 9
      ALLOCATION_1: 9
      ALLOCATION_2: 9
    controller_pool_file: controller/balanced_fact_pool.json
    pilot_counterpart: task004_allfacts_b90_full_communication_suite/false_allfacts_rho1.yaml
    paired_initialization_source: /shared/MA-CC-results/24-09-2026-task004-rho1_initializations
    paired_with: no_controller/rho1 (24-09-2026-task004-rho1)
    pairing_note: 'Paired episode-for-episode with the no-controller baseline. NOT paired with the pilot''s
      all_nondecisive arms: those set require_artifact false against a missing directory and generated
      their own initial votes.'
