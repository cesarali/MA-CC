# Report only: saved estimates and recorded trajectories; no estimator reruns.
schema_version: 1
report:
  id: recomm_only_q12_chatoss_false_control_report
  title: 'Recommendation-Only q=12 GPT-OSS False Control: Saved Results Only'
  source_analysis: ../../../../../../results/aggregation_results_local/recomm_only_q12_chatoss_false_control_saved_report_data
  output_dir: ../../../../../../results/reports/recomm_only_q12_chatoss_false_control
sections:
- id: validation
  title: Validation and completeness
  kind: validation_summary
- id: target_occupancy_before
  kind: occupancy_bar_summary
  title: Mean start-of-round false-target share
  label: Mean start-of-round false-target share
  description: Each retained round from completed episodes has equal weight; all rounds
    are included. Pooled across budgets. Descriptive means, not causal effects; no
    confidence intervals are shown.
  source_summary: ../../../../../../results/report_inputs/recomm_only_q12_chatoss_false_control/target_occupancy.parquet
- id: target_occupancy_after
  kind: occupancy_bar_summary
  title: Mean end-of-round false-target share
  label: Mean end-of-round false-target share
  description: Each retained round from completed episodes has equal weight; all rounds
    are included. Pooled across budgets. Descriptive means, not causal effects; no
    confidence intervals are shown.
  source_summary: ../../../../../../results/report_inputs/recomm_only_q12_chatoss_false_control/target_occupancy_after.parquet
- id: target_occupancy_final
  kind: occupancy_bar_summary
  title: Mean final-episode false-target share
  label: Mean final-episode false-target share
  description: Final share uses the last recorded round of each completed episode;
    each episode has equal weight. Pooled across budgets. Descriptive means, not causal
    effects; no confidence intervals are shown.
  source_summary: ../../../../../../results/report_inputs/recomm_only_q12_chatoss_false_control/target_occupancy_final.parquet
- id: null_model_summary
  title: Null-model comparison
  kind: null_summary
  source: primary_estimates
  metric: round_target_actuation_cmi
- id: budget_curves
  title: Information, susceptibility, and efficiency vs budget
  kind: budget_curve_suite
  x: intervention_budget
  views:
  - resolved
  metrics:
  - id: T_pi
    label: T_pi [bits]
    source: primary_estimates
    metric: round_target_actuation_cmi
  - id: chi
    label: Stored susceptibility chi
    source: primary_estimates
    metric: round_target_susceptibility
  - id: eta_IF
    label: Information fraction eta_IF
    source: primary_estimates
    metric: round_target_information_fraction
  - id: sensing
    label: Sensing information [bits]
    source: primary_estimates
    metric: round_sensing_mi
  - id: epistemic_information
    label: Epistemic-conditioned target information [bits]
    source: primary_estimates
    metric: round_epistemic_target_actuation_cmi
- id: state_budget_phase_diagrams
  title: State-by-budget phase diagrams
  kind: state_budget_phase_suite
  axes:
    state: target_fraction_bin_center
    budget: intervention_budget
    state_domain:
    - 0.0
    - 1.0
    minimum_state_bins: 8
  facets:
    mode: auto
    preferred:
    - target_semantics
    - epistemic_persistence
    - social_group_size
    - task_id
    - beta
    - threshold
    - sensor_sample_size
    - receiver_epistemic_disposition
    - controller_evidence_strategy
    - controller_actuation_mode
    - controller_communication_policy
  max_panels_per_figure: 6
  views:
  - resolved
  metrics:
  - id: T_pi_state
    label: State-by-budget information map (not retained)
    source: primary_estimates
    metric: round_target_actuation_cmi
- id: propensity_weighted_x_budget_maps
  title: Propensity-weighted causal response by target state and budget
  kind: state_budget_phase_suite
  axes:
    state: target_fraction_bin_center
    budget: intervention_budget
    state_domain:
    - 0.0
    - 1.0
    minimum_state_bins: 8
  views:
  - resolved
  metrics:
  - id: propensity_response_x_b_lag_1_linear
    label: Propensity-weighted causal response (lag 1, linear)
    source: causal_response_state_local_lag_1
    metric: propensity_weighted_causal_response
    color_scale: diverging
- id: episode_examples
  title: Illustrative episode trajectories
  kind: episode_timeseries
  source: recorded_rounds
  filters:
    intervention_budget:
    - 6
    - 18
  group_by:
  - intervention_budget
  - epistemic_persistence
  episodes_per_group: 1
  metrics:
  - value: controller_target_share_before
    label: False-target share (before)
    ylim:
    - 0
    - 1
  - value: controller_target_share
    label: False-target share (after)
    ylim:
    - 0
    - 1
  - value: truth_vote_share
    label: Truth share (after)
    ylim:
    - 0
    - 1
  - value: active_full_proof_agent_share_before
    label: Recorded full-proof share (before)
    ylim:
    - 0
    - 1
  - value: active_mean_supporting_fact_coverage_before
    label: Recorded fact coverage (before)
    ylim:
    - 0
    - 1
  description: Direct recorded values, without recomputing epistemic or causal estimators.
    First sorted episode per budget/persistence group, independent of outcome. The
    archive contains only whole-cell estimates; state-resolved and propensity-weighted
    maps are unavailable.
