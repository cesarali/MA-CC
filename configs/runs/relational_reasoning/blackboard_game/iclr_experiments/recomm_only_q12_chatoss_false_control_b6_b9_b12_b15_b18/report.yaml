schema_version: 1

report:
  id: recomm_only_q12_chatoss_false_control_b6_b9_b12_b15_b18_report
  title: "Recommendation-Only q=12 GPT-OSS False Control: Five-Budget Complementary Study"
  source_analysis: ../../../../../../results/aggregation_results_local/recomm_only_q12_chatoss_false_control_b6_b9_b12_b15_b18_report_union
  output_dir: ../../../../../../results/reports/recomm_only_q12_chatoss_false_control_b6_b9_b12_b15_b18

sections:
  - id: validation
    title: Validation and completeness
    kind: validation_summary

  - id: null_model_summary
    title: Null-model comparison
    kind: null_summary
    source: primary_estimates
    metric: round_target_actuation_cmi

  - id: budget_curves
    title: Information, susceptibility, and efficiency vs budget
    kind: budget_curve_suite
    x: intervention_budget
    views: [resolved, aggregated]
    metrics:
      - id: T_pi
        label: T_pi [bits]
        source: primary_estimates
        metric: round_target_actuation_cmi
        aggregation_source: study_aggregated_metrics
        aggregation_metric: round_target_actuation_cmi
      - id: chi
        label: Susceptibility chi (occupancy weighted)
        source: derived_observables
        metric: susceptibility_occupancy_weighted
        aggregation_source: study_aggregated_metrics
        aggregation_metric: susceptibility_occupancy_weighted
      - id: eta_IF
        label: eta_IF
        source: primary_estimates
        metric: round_target_information_fraction
        aggregation_source: study_aggregated_metrics
        aggregation_metric: round_target_information_fraction
      - id: eta_IR
        label: eta_IR
        source: derived_observables
        metric: eta_ir
        aggregation_source: study_aggregated_metrics
        aggregation_metric: eta_ir

  - id: available_susceptibility_budget
    title: Available susceptibility vs budget
    kind: budget_curve_suite
    views: [resolved, aggregated]
    metrics:
      - id: available_susceptibility_budget
        label: Available-mass-weighted causal susceptibility
        source: available_causal_susceptibility_summary
        metric: available_mass_weighted_causal_susceptibility
        aggregation_source: causal_response_aggregated_metrics
        aggregation_metric: available_mass_weighted_causal_susceptibility

  - id: lagged_causal_response
    title: Causal response at lags 1, 2, and 3
    kind: budget_curve_suite
    views: [resolved, aggregated]
    metrics:
      - id: causal_response_lag_1
        label: Causal response at lag 1 round
        source: causal_response_effects
        metric: propensity_weighted_causal_response
        aggregation_source: causal_response_aggregated_metrics
        aggregation_metric: propensity_weighted_causal_response
        filters: {lag: 1}
      - id: causal_response_lag_2
        label: Causal response at lag 2 rounds
        source: causal_response_effects
        metric: propensity_weighted_causal_response
        aggregation_source: causal_response_aggregated_metrics
        aggregation_metric: propensity_weighted_causal_response
        filters: {lag: 2}
      - id: causal_response_lag_3
        label: Causal response at lag 3 rounds
        source: causal_response_effects
        metric: propensity_weighted_causal_response
        aggregation_source: causal_response_aggregated_metrics
        aggregation_metric: propensity_weighted_causal_response
        filters: {lag: 3}

  - id: epistemic_budget_curves
    title: Epistemic metrics vs budget
    kind: budget_curve_suite
    x: intervention_budget
    views: [aggregated]
    metrics:
      - {id: fraction_rounds_collectively_solvable, label: Collectively solvable rounds, aggregation_source: epistemic_aggregated_metrics, aggregation_metric: fraction_rounds_collectively_solvable}
      - {id: mean_symbolic_individual_solvability_share, label: Individual solvability share, aggregation_source: epistemic_aggregated_metrics, aggregation_metric: mean_symbolic_individual_solvability_share}
      - {id: mean_fragmentation_gap, label: Fragmentation gap, aggregation_source: epistemic_aggregated_metrics, aggregation_metric: mean_fragmentation_gap}
      - {id: mean_active_union_fact_fraction, label: Active union fact fraction, aggregation_source: epistemic_aggregated_metrics, aggregation_metric: mean_active_union_fact_fraction}
      - {id: mean_active_holder_redundancy, label: Fact holder redundancy, aggregation_source: epistemic_aggregated_metrics, aggregation_metric: mean_active_holder_redundancy}
      - {id: mean_collective_gold_probability, label: Collective gold probability, aggregation_source: epistemic_aggregated_metrics, aggregation_metric: mean_collective_gold_probability}
      - {id: mean_collective_entropy, label: Collective normalized entropy, aggregation_source: epistemic_aggregated_metrics, aggregation_metric: mean_collective_entropy}
      - {id: mean_configured_robustness, label: Robustness at configured persistence, aggregation_source: epistemic_aggregated_metrics, aggregation_metric: mean_configured_robustness}
      - {id: mean_reference_robustness, label: Robustness at reference persistence, aggregation_source: epistemic_aggregated_metrics, aggregation_metric: mean_reference_robustness}

  - id: state_budget_phase_diagrams
    title: State-by-budget phase diagrams
    kind: state_budget_phase_suite
    axes:
      state: target_fraction_bin_center
      budget: intervention_budget
      state_domain: [0.0, 1.0]
      minimum_state_bins: 8
    facets:
      mode: auto
      preferred: [target_semantics, epistemic_persistence, social_group_size, task_id, beta, threshold, sensor_sample_size, receiver_epistemic_disposition, controller_evidence_strategy, controller_actuation_mode, controller_communication_policy]
    max_panels_per_figure: 6
    views: [resolved, aggregated]
    metrics:
      - {id: T_pi, label: "T_pi [bits]", source: primary_estimates, metric: round_target_actuation_cmi, aggregation_source: rho_aggregated_state_local_maps, aggregation_metric: T_pi, color_scale: linear}
      - {id: eta_IF, label: eta_IF, source: primary_estimates, metric: round_target_information_fraction, aggregation_source: rho_aggregated_state_local_maps, aggregation_metric: eta_IF, color_scale: linear}
      - {id: eta_IR, label: eta_IR, source: derived_observables, metric: eta_ir_state_local, aggregation_source: rho_aggregated_state_local_maps, aggregation_metric: eta_IR, color_scale: linear}
      - {id: occupancy, label: Round observations, source: state_occupancy_binned, value: n_observations, aggregation_source: rho_aggregated_state_occupancy, aggregation_value: n_observations, color_scale: linear}
      - {id: susceptibility, label: Susceptibility chi, source: primary_estimates, metric: round_target_susceptibility, aggregation_source: rho_aggregated_state_local_maps, aggregation_metric: chi, color_scale: diverging}
      - id: susceptibility_symlog
        label: Susceptibility chi [symmetric-log color scale]
        source: primary_estimates
        metric: round_target_susceptibility
        aggregation_source: rho_aggregated_state_local_maps
        aggregation_metric: chi
        color_scale: {kind: symlog, linthresh: 0.001}
      - {id: available_causal_susceptibility_linear, label: Available causal susceptibility (linear colors), source: available_causal_susceptibility_state_local, metric: propensity_weighted_available_susceptibility, aggregation_source: causal_state_local_aggregated_metrics, aggregation_metric: propensity_weighted_available_susceptibility, color_scale: diverging}
      - id: available_causal_susceptibility
        label: Available causal susceptibility
        source: available_causal_susceptibility_state_local
        metric: propensity_weighted_available_susceptibility
        aggregation_source: causal_state_local_aggregated_metrics
        aggregation_metric: propensity_weighted_available_susceptibility
        color_scale: {kind: symlog, linthresh: 0.001}

  - id: null_adjusted_information_phase_diagram
    title: Null-adjusted state-by-budget information
    kind: state_budget_phase_suite
    axes:
      state: target_fraction_bin_center
      budget: intervention_budget
      state_domain: [0.0, 1.0]
      minimum_state_bins: 8
    facets:
      mode: auto
      preferred: [target_semantics, social_group_size, task_id, beta, threshold, sensor_sample_size, receiver_epistemic_disposition, controller_evidence_strategy, controller_actuation_mode, controller_communication_policy]
    max_panels_per_figure: 6
    views: [aggregated]
    metrics:
      - id: T_pi_minus_null
        label: "T_pi minus permutation-null mean [bits]"
        aggregation_source: rho_aggregated_state_local_maps
        aggregation_metric: T_pi
        aggregation_value: null_adjusted_estimate
        color_scale: diverging

  - id: epistemic_phase_maps
    title: Target share and individual solvability phase diagrams
    kind: epistemic_phase_suite
    metrics:
      - {id: causal_susceptibility, label: Causal susceptibility, source: epistemic_causal_susceptibility, value: causal_susceptibility, filters: {surface_kind: raw_binned}}
      - {id: target_drift_contrast, label: Target-share change (activation minus silence), source: epistemic_joint_drift, value: delta_x, filters: {branch: contrast}}
      - {id: solvability_drift_contrast, label: Solvability change (activation minus silence), source: epistemic_joint_drift, value: delta_phi_star, filters: {branch: contrast}}
