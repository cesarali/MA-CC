state_local: [x, x_phi, x_kappa]
episode_endpoints: {classifier: relational_persistence_truth_aligned_v1}
plots:
  late_time_controller_target_share_by_budget: {source: episode_endpoints, value: late_time_mean_controller_target_share, x: actuation_fraction, series: epistemic_persistence, kind: line, show_variability: true}
  truth_takeover_fraction_by_budget: {source: episode_endpoint_summary, value: truth_final_takeover_fraction, x: actuation_fraction, series: epistemic_persistence, kind: line}
  late_time_active_phi_by_budget: {source: episode_endpoints, value: late_time_mean_active_phi, x: actuation_fraction, series: epistemic_persistence, kind: line, show_variability: true}
  late_time_truth_share_by_budget: {source: episode_endpoints, value: late_time_mean_truth_share, x: actuation_fraction, series: epistemic_persistence, kind: line, show_variability: true}
  chi_by_budget: {source: derived_observables, metric: susceptibility_occupancy_weighted, x: actuation_fraction, series: epistemic_persistence, kind: line}
  information_efficiency_by_budget: {source: primary_estimates, metric: round_target_information_fraction, x: actuation_fraction, series: epistemic_persistence, kind: line}
  eta_th_by_budget: {source: derived_observables, metric: eta_th, x: actuation_fraction, series: epistemic_persistence, kind: line}
  late_time_controller_target_share_heatmap: {source: episode_endpoint_summary, value: late_time_mean_controller_target_share, x: actuation_fraction, y: epistemic_persistence, kind: heatmap}
  truth_takeover_fraction_heatmap: {source: episode_endpoint_summary, value: truth_final_takeover_fraction, x: actuation_fraction, y: epistemic_persistence, kind: heatmap}
  late_time_active_phi_heatmap: {source: episode_endpoint_summary, value: late_time_mean_active_phi, x: actuation_fraction, y: epistemic_persistence, kind: heatmap}
  late_time_truth_share_heatmap: {source: episode_endpoint_summary, value: late_time_mean_truth_share, x: actuation_fraction, y: epistemic_persistence, kind: heatmap}
  chi_heatmap: {source: derived_observables, metric: susceptibility_occupancy_weighted, x: actuation_fraction, y: epistemic_persistence, kind: heatmap}
  information_efficiency_heatmap: {source: primary_estimates, metric: round_target_information_fraction, x: actuation_fraction, y: epistemic_persistence, kind: heatmap}
  eta_th_heatmap: {source: derived_observables, metric: eta_th, x: actuation_fraction, y: epistemic_persistence, kind: heatmap}
  chi_x_b_by_rho: {source: primary_estimates, metric: round_target_susceptibility, filters: {resolution: x}, x: actuation_fraction, y: target_fraction_before, facet: epistemic_persistence, kind: heatmap}
  target_information_x_b_by_rho: {source: primary_estimates, metric: round_target_actuation_cmi, filters: {resolution: x}, x: actuation_fraction, y: target_fraction_before, facet: epistemic_persistence, kind: heatmap}
  eta_ir_x_b_by_rho: {source: derived_observables, metric: eta_ir_state_local, filters: {resolution: x}, x: actuation_fraction, y: target_fraction_before, facet: epistemic_persistence, kind: heatmap}
