# Relational reasoning - population study 04:
# sensing/actuation RESOURCE GRID, arm q_c = 6.
#
# ---------------------------------------------------------------------------
# WHAT THIS IS
#
# Study 03 arm G measured the controller-to-population information channel at
# ONE point of the resource plane: q_c = 12, b = 12, both at half the
# population. It answered "are these quantities estimable at all" and the
# answer was yes. It could not answer how the channel SCALES, because a single
# point has no slope.
#
# Study 04 is that same measurement over a 3 x 3 grid:
#
#     q_c in {6, 12, 18}   x   b in {6, 12, 18}
#
# THIS FILE IS THE q_c = 6 ROW. It sweeps b in {6, 12, 18} over the two
# matched worlds and holds everything else at the Study 03 values. The other
# two rows are `relational_population_study04_qc06.yaml`,
# `relational_population_study04_qc12.yaml` and
# `relational_population_study04_qc18.yaml` - three files, one experiment.
#
# The split into three configs is OPERATIONAL ONLY. Scientifically the three
# together are one 3 x 3 resource grid over two matched tasks. They are split
# because each is independently launchable and independently resumable, so an
# overnight run that dies in row two does not cost rows one and three.
#
# ---------------------------------------------------------------------------
# THE ROUND-LEVEL ORDERING (UNCHANGED FROM STUDY 03)
#
#     N_k  ->  Y_k (sensor, q_c = 6 agents)
#          ->  U_k in {NO_OP, ADVOCATE}   (stochastic, soft policy)
#          ->  b controlled positions IF U_k = ADVOCATE, else exactly 0
#          ->  N_{k+1}
#
# with the same soft policy Study 03 ran, unchanged:
#
#     P(U_k = ADVOCATE | Y_k) = sigmoid[ beta * (threshold - p_Z(Y_k)) ]
#
# beta = 4, threshold = 0.5. This is `SoftTargetControl.select_action` /
# `advocacy_probability`; no controller code was written for this study.
#
# ---------------------------------------------------------------------------
# q_c AND b ARE INDEPENDENT RESOURCES - THAT IS THE WHOLE POINT OF STUDY 04
#
# Study 03 held them numerically equal (12 = 12) and its header warned that
# this was a coincidence of that pilot. Study 04 breaks the coincidence on
# purpose: this row alone contains cells with q_c = 6 against b = 6, 12 and
# 18, so sensing and actuation can be told apart.
#
#     q_c = 6   how many agents the controller LOOKS AT, once, at the start
#                of the round (`ThresholdTargetControl.interaction_signal`,
#                `rng.sample(state.agents, sensor_sample_size)` - without
#                replacement, exchangeable, VOTES ONLY, never any K_i).
#                sensing fraction q_c/N = 0.25
#     b          how many UPDATE POSITIONS are actuated afterwards, and only
#                on an ADVOCATE round (`sample_controlled_positions`, called in
#                `runtime.py` under `if action == ADVOCATE_TARGET else ()`).
#                control fraction c = b/N in {0.25, 0.5, 0.75}
#
# The sensed agents and the controlled positions come from SEPARATE seeded
# streams (`relational-sensor:*` vs `relational-schedule:<round>`) and are not
# required to coincide - they are not even in the same index space (agent
# identities vs within-round update slots). Do not tie them together.
#
# ---------------------------------------------------------------------------
# FIXED ACROSS EVERY CELL OF EVERY STUDY 04 CONFIG
#
#   N = 24     L = 2      r = 6       q = 1      K = 3 options, 4 distractors
#   rounds = 10           threshold = 0.5        beta = 4
#   advocacy_schedule: soft         message_mode: recommendation_only
#   target: 2 (a PINNED, verified-incorrect option index - see below)
#   social_distrust: true           initialization: local_vote
#   stop_on_consensus: false        semantic option shuffling (per call)
#   artifact_profile: results_only
#   provider/model/temperature/max_output_tokens: identical to Study 03
#
# SWEPT IN THIS FILE: b in {6, 12, 18} x task_id in 20 tasks (see grid)
#   -> 60 cells. cygnus 2026-09-12: widened from 2 tasks (6 cells) so the task
#   is a random effect to average over rather than a fixed nuisance (layout
#   spec: 20 distinct tasks). At this file's repetitions (2, smoke) -> 120
#   episodes; at Cesar's 30 -> 1800 episodes.
# SWEPT ACROSS THE STUDY: the above, x q_c in {6, 12, 18} (the three files)
#   -> 180 cells; 360 episodes at 2 reps, 5400 at 30.
# NOTHING ELSE IS SWEPT.
#
# ---------------------------------------------------------------------------
# WHY target IS AN INDEX AND NOT `random_incorrect`
#
# Unchanged from Study 03, and it matters more here because there are more
# cells. `random_incorrect` resolves per EPISODE from the episode seed, and the
# episode seed is derived from the GRID CELL INDEX
# (`orchestrator.py`: Seed(execution.seed).derive("grid-cell:i").derive("episode:j")),
# so two repetitions of one cell can advocate two different relations. An
# option index is seed- and cell-independent, so all 540 episodes advocate one
# fixed relation per world.
#
# Index 2 is verified INCORRECT for every task in the grid (pop24_L2_r06_n40,
# checked by script 2026-09-12; 26 of the 40 tasks qualify, the first 20 are used):
#
#   task_0001  possible_answers = [SOUTHWEST, WEST, EAST]
#              correct = WEST (index 1)       -> target index 2 = EAST
#   task_0002  possible_answers = [SOUTHEAST, SOUTHWEST, SOUTH]
#              correct = SOUTHWEST (index 1)  -> target index 2 = SOUTH
#   task_0003  possible_answers = [NORTH, NORTHWEST, EAST]
#              correct = NORTH (index 0)      -> target index 2 = EAST
#   task_0004  possible_answers = [SOUTHEAST, NORTH, NORTHWEST]
#              correct = SOUTHEAST (index 0)  -> target index 2 = NORTHWEST
#   task_0005  possible_answers = [WEST, SOUTHEAST, NORTH]
#              correct = WEST (index 0)       -> target index 2 = NORTH
#   task_0007  possible_answers = [SOUTH, NORTHWEST, SOUTHWEST]
#              correct = SOUTH (index 0)      -> target index 2 = SOUTHWEST
#   task_0008  possible_answers = [SOUTHWEST, WEST, NORTHWEST]
#              correct = SOUTHWEST (index 0)  -> target index 2 = NORTHWEST
#   task_0009  possible_answers = [SOUTH, NORTHWEST, NORTH]
#              correct = NORTHWEST (index 1)  -> target index 2 = NORTH
#   task_0011  possible_answers = [NORTH, WEST, NORTHWEST]
#              correct = NORTH (index 0)      -> target index 2 = NORTHWEST
#   task_0012  possible_answers = [NORTHWEST, SOUTH, EAST]
#              correct = SOUTH (index 1)      -> target index 2 = EAST
#   task_0013  possible_answers = [NORTHWEST, SOUTHWEST, SOUTH]
#              correct = NORTHWEST (index 0)  -> target index 2 = SOUTH
#   task_0014  possible_answers = [WEST, NORTH, SOUTHEAST]
#              correct = NORTH (index 1)      -> target index 2 = SOUTHEAST
#   task_0018  possible_answers = [NORTHEAST, NORTH, SOUTH]
#              correct = NORTH (index 1)      -> target index 2 = SOUTH
#   task_0021  possible_answers = [NORTH, EAST, NORTHWEST]
#              correct = NORTH (index 0)      -> target index 2 = NORTHWEST
#   task_0022  possible_answers = [SOUTHEAST, SOUTH, NORTH]
#              correct = SOUTHEAST (index 0)  -> target index 2 = NORTH
#   task_0023  possible_answers = [NORTHWEST, WEST, NORTH]
#              correct = NORTHWEST (index 0)  -> target index 2 = NORTH
#   task_0024  possible_answers = [EAST, NORTH, WEST]
#              correct = NORTH (index 1)      -> target index 2 = WEST
#   task_0027  possible_answers = [SOUTH, NORTHEAST, SOUTHEAST]
#              correct = NORTHEAST (index 1)  -> target index 2 = SOUTHEAST
#   task_0028  possible_answers = [SOUTHWEST, NORTH, NORTHWEST]
#              correct = SOUTHWEST (index 0)  -> target index 2 = NORTHWEST
#   task_0030  possible_answers = [EAST, WEST, NORTHEAST]
#              correct = EAST (index 0)       -> target index 2 = NORTHEAST
#
# Excluded because index 2 IS the correct answer there: task_0006, task_0010,
# task_0015, task_0016, task_0017, task_0019, task_0020, task_0025, task_0026,
# task_0029, task_0034..0037. This is per-task, not a dataset invariant.
# Re-check before widening `game.options.task_id` again.
#
# ---------------------------------------------------------------------------
# THE SEED IS SHARED WITH THE OTHER TWO ROWS ON PURPOSE
#
# All three Study 04 configs use execution.seed 20260821, and all three declare
# the grid axes in the same order, so cell index i is the same (b, task) pair
# in every row. Episode seeds derive from the cell index, so episode j of
# (b = 6, task_0001) starts from the SAME initial population in the q_c = 6,
# 12 and 18 rows. That is common random numbers across the sensing axis: the
# q_c comparison is paired, and differences between rows are not initial-
# condition noise. Do not renumber the axes in one file only.
#
# ---------------------------------------------------------------------------
# COST (THIS FILE)
#
#   60 cells x repetitions: 120 episodes at 2 (smoke), 1800 at 30 (row).
#   Per episode: 264 nominal provider calls = 24 initial votes + 24 x 10 focal
#   updates. `q` does not change this - control REPLACES a social slot rather
#   than adding one, so a focal update is one call whatever q is. Neither q_c
#   nor b changes it either: sensing reads recorded votes and makes no call,
#   and a controlled position is still one focal update.
#   Row total: 47,520 nominal. Run `experiment preflight` for the expected and
#   conservative bounds; it makes no model calls.
#
# ---------------------------------------------------------------------------
# RUN FROM THE REPOSITORY ROOT
#
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment preflight \
#     --config configs/runs/relational_reasoning/population_study_04/relational_population_study04_qc06.yaml \
#     --output-dir results/inspection/relational_study04_qc06_preflight
#
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment run \
#     --config configs/runs/relational_reasoning/population_study_04/relational_population_study04_qc06.yaml
#
# THEN (offline, no model calls):
#
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main analysis relational-round-feedback \
#     --run-dir results/<run-id>
# ---------------------------------------------------------------------------

llm_provider:
  type: university
  model: qwen3.6-35b-fast
  credentials_env: LLM_KEY
  base_url_env: LLM_BASE
  timeout_seconds: 180
  max_retries: 2
  # cygnus 2026-09-12: 8 -> 32 -> 64 -> 8, matched to execution.parallelism
  # below (each episode holds at most one request in flight, so the lower of
  # the two is the real ceiling). The binding limit is NOT the key's 1000 rpm:
  # the gateway's qwen/glm/kimi "-fast" models are neuralwatt upstreams whose
  # plan allows 10 CONCURRENT requests per model, shared by every gateway user.
  # Smoke job 89 ran 12 in flight and drew 429 "Concurrent limit reached for
  # Qwen/Qwen3.6-35B-A3B: 10/10 slots in use" from the first minute; 4 of 12
  # episodes died on it (his max_retries 2 is not enough under sustained
  # contention). 8 leaves two slots for other users. Measured latency 3.7 s/call
  # => ~2.2 calls/s => ~16 min per episode, 8 at a time.
  request_concurrency: 8
  temperature: 0.0
  # gpt-oss is a reasoning model: `reasoning_content` and the answer are both
  # charged against max_tokens, and below roughly 1k the answer is truncated
  # away and `content` arrives empty. Not a cost dial - bound spend with
  # budget.max_cost_per_run.
  max_output_tokens: 1024
  options:
    estimated_latency_seconds: 10.0

prompt:
  schema_version: 2
  prompt_family: relational_public_ballot
  prompt_version: 1
  response_contract:
    type: relational_public_ballot
    # The letters a call presents. Which relation each names is shuffled per
    # call; the population state is the relation, never the letter.
    allowed_values: [A, B, C]

game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 10
  topology: complete
  options:
    # cygnus 2026-09-12: pop24_L2_r06 has 10 tasks; pop24_L2_r06_n40 is the SAME
    # generator config and dataset_seed (20260818) at --num-tasks 40. Task seeds
    # derive from (dataset_seed, index), so task_0001..0010 are byte-identical
    # to the original (all 10 fingerprints match); 0011..0040 are new. Must be
    # copied to the cluster alongside src/ before a run.
    task_dataset_dir: src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r06_n40
    # Swept below over the two matched worlds; this is the base value.
    task_id: task_0001
    dynamics_mode: reasoning
    rounds: 10
    social_group_size: 1
    vote_visibility: public
    prompt_version: 1
    social_distrust: true
    # Must stay false: a consensus stop would truncate episodes to different
    # lengths and put the round-indexed information estimates on ragged data.
    stop_on_consensus: false
    # cygnus 2026-09-12: 1 -> 5. Measured on the 2026-09-11 live run against
    # qwen3.6-35b-fast: 4.4% of replies exceeded MAX_REASON_CHARACTERS (inside
    # the 5% budgeted below), but a failed reply's corrected retry failed again
    # ~25% of the time, and one double-fail aborts the episode. Over 264 calls
    # P(abort) ~ 1 - (1 - 0.044*0.25^k)^264: k=1 -> 95%, k=3 -> 17%, k=5 -> 1%.
    # Cost: expected attempts stay ~1.05x (see game.call_plan); only the
    # preflight's CONSERVATIVE bound scales with 1+k, so budget caps below are
    # sized for k=5. A leniency change to the experiment - approved by Allen.
    invalid_response_retries: 5
    expected_validation_failure_rate: 0.05
    initialization:
      # Each agent decides once from K_i(0) alone, so the starting population
      # reflects the distributed-information problem rather than a coin flip.
      mode: local_vote

control:
  mechanism: relational_round_budgeted
  options:
    # Pinned zero-based index into the task's frozen `possible_answers`.
    # Verified incorrect for task_0001 (EAST) and task_0002 (SOUTH).
    target: 2
    # q_c: agents sensed per round, sampled without replacement, votes only.
    # THIS IS THE AXIS THIS FILE PINS. The other two rows set 6 and 18.
    # q_c/N = 0.25
    sensor_sample_size: 6
    policy: soft_target
    threshold: 0.5
    beta: 4.0
    # b: controlled update positions per ADVOCATE round. SWEPT below over
    # {6, 12, 18}; this is the base value the grid overrides. Independent of
    # q_c above - see the header.
    intervention_budget: 12
    # `soft` closes the loop and makes U_k stochastic, so H(U_k) > 0 and the
    # actuation CMIs are estimable at all. `always` would pin H(U_k) = 0 and
    # every information quantity to zero. Study 04 is an information study;
    # this must not be changed to `always`.
    advocacy_schedule: soft
    message_mode: recommendation_only

execution:
  # Shared with the other two rows on purpose - see the header. Bumped from
  # Study 03's 20260820 so Study 04 is not a seed-for-seed replay of the pilot.
  seed: 20260821
  repetitions: 2
  # cygnus 2026-09-12: 8 -> 32 -> 64 -> 8 concurrent episodes (see
  # request_concurrency: the upstream plan's 10-slot cap per model is the
  # ceiling). Episodes are asyncio tasks in one process (~44 MB each measured),
  # so CPU/memory are not the constraint - provider slots are. 60-cell grid x 2
  # reps = 120 episodes is 15 waves of ~16 min = ~4 h on one model; a 30-rep
  # row (1800 episodes) ~2 days. Faster needs more slots (plan upgrade, more
  # models in parallel, or local inference), not a bigger number here.
  parallelism: 8
  fail_fast: false

pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false

budget:
  accounting_unit: proxy_accounting_unit
  # cygnus 2026-09-12: 25 -> 30. The preflight denies a run whose conservative
  # bound (worst case: every call retried invalid_response_retries times)
  # exceeds this. Smoke (12 episodes, 1024 out-tokens) was 8.31 at k=1, i.e.
  # ~4.16 x (1+k): k=5 -> 24.9, so 25 would deny by a hair. For a full row
  # (180 episodes) the same arithmetic gives ~375 at k=5 (~250 at k=3) - raise
  # these and the gateway key's max_budget together before a row run.
  # cygnus 2026-09-12 (tasks 2 -> 20): 30 -> 260. Cells x10, so the k=5 smoke
  # bound is ~249 (120 episodes). Realistic spend for this smoke: ~$11-64.
  # A 30-repetition row at 20 tasks is 1800 episodes: conservative bound ~3700
  # at k=5, realistic ~$160-950 - the gateway key's max_budget (150) and
  # these caps must both be raised before that run.
  system_max_cost_per_run: 260.0
  max_cost_per_run: 260.0
  # Conservative (retry-bound) call count for this row is 95,040, so the guard
  # still sits above the worst case with room to spare.
  max_provider_requests: 200000
  max_input_tokens: 1000000000
  max_output_tokens: 100000000
  allow_unbounded_paid_requests: false

logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    prompt_examples:
      count: 1
      scope: cell

storage:
  output_dir: results
  # The per-round scientific channel - round_records/<episode>/
  # round_trajectory.jsonl - is what the information analysis reads, and
  # results_only keeps exactly that plus the compact table, the cell
  # aggregate, one prompt example per cell and the resolved config.
  format: jsonl
  artifact_profile: results_only
  checkpoint_mode: episode
  overwrite: false

analysis:
  # ON, and the estimator list is written out in full on purpose: this block is
  # the study's measurement plan, not a runtime detail. `experiment preflight`
  # validates every name below against ROUND_ANALYSIS_STATISTICS, so a typo
  # fails before the run spends anything.
  #
  # Identical to Study 03 arm G. No estimator was added for Study 04 - the
  # resource grid is a sweep over the SAME measurement, which is the only way
  # the 3 x 3 surface is comparable point to point.
  enabled: true
  estimators:
    # --- sensing ---------------------------------------------------------
    # I(N_k ; Y_k): how much the q_c = 6 sample tells the controller about
    # the population it is about to act on. This is the quantity the q_c axis
    # exists to move, so it is the first thing to read off this study.
    - round_sensing_mi
    - round_target_sensing_mi
    - round_target_susceptibility
    - round_sensor_mae
    - round_sensor_mse

    # --- controller action as a random variable ---------------------------
    # Under `always`, H(U_k) = 0 and every quantity below is identically zero.
    - round_controller_action_entropy
    - round_controller_action_entropy_given_population

    # --- actuation: how many bits U_k puts into each channel --------------
    - round_population_actuation_cmi      # I(U ; N_{k+1} | N_k)
    - round_target_actuation_cmi          # I(U ; n_Z,k+1   | n_Z,k)
    - round_truth_actuation_cmi           # I(U ; n_truth,k+1 | n_truth,k)
    - round_order_actuation_cmi
    - round_population_information_fraction
    - round_target_information_fraction

    # --- state-action support: can the CMIs be estimated at all -----------
    # Read these BEFORE the numbers above. A conditioning slice that only ever
    # saw one action contributes nothing. Support is expected to VARY across
    # the grid: a large b moves the population faster and can thin the states
    # that carry both actions, so a cell's support must be read next to its
    # own estimate rather than assumed from the pilot.
    - round_conditioning_state_count
    - round_dual_action_state_fraction
    - round_dual_action_event_fraction
    - round_single_action_slice_fraction
    - round_singleton_fraction

    # --- signed response: direction, not just magnitude -------------------
    # A CMI is unsigned; these say which way the controller pushed.
    - round_target_signed_response_share
    - round_target_signed_actuation
    - round_truth_signed_actuation
    - round_order_signed_actuation

    # --- epistemic-memory conditioning ------------------------------------
    # Same CMI estimator throughout; only the conditioning state widens.
    #   memory     -> E_k = (n0, n1, n2), the exact histogram. The
    #                 high-dimensional reference, KEPT even when sparse.
    #   epistemic  -> joint (kappa, phi) bin pair (epistemic_bins per axis).
    #   phi        -> full-proof fraction n2/N,       3 bins: low/medium/high
    #   susceptible-> 1 - phi, the socially movable fraction, same 3 bins
    #   kappa      -> mean supporting-fact coverage,  same 3 bins
    # phi/susceptible/kappa are conditioned on SEPARATELY, never jointly.
    # Because s = 1 - phi, the phi- and susceptible-conditioned estimates will
    # usually be identical; `analysis_summary.json` reports
    # `phi_susceptible_partition_identical` rather than leaving that to be
    # rediscovered.
    - round_memory_target_actuation_cmi
    - round_epistemic_target_actuation_cmi
    - round_phi_target_actuation_cmi
    - round_susceptible_target_actuation_cmi
    - round_kappa_target_actuation_cmi
    # ... and the signed response matched on each of those same states.
    - round_memory_target_signed_response
    - round_epistemic_target_signed_response
    - round_phi_target_signed_response
    - round_susceptible_target_signed_response
    - round_kappa_target_signed_response
  options:
    theoretical_reference: single_affinity_revised
    bootstrap_resamples: 1000
    null_permutations: 1000
    confidence: 0.95
    # Bins per axis for the JOINT (kappa, phi) conditioning only. The three
    # scalar conditionings above are fixed at low/medium/high by design.
    epistemic_bins: 4
    # Left false, as in Study 03. Per-cell estimates are emitted as ROWS of
    # `round_information_estimates.csv` either way; this flag only controls
    # whether each cell additionally gets its own report bundle written during
    # the run, and 6 more bundles per row is 18 more across the study for no
    # extra information.
    per_cell_reports: false

metrics:
  enabled: true
  comet_export: []

aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order, dominant_action_share]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0

observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 25
    sweep_experiment: true
    cell_reporting: master
    metric_plots: true

experiment:
  name: relational-study04-qc06-resource-grid
  description: >-
    Relational reasoning population study 04, sensing/actuation resource grid,
    row q_c = 6 (sensing fraction 0.25). N=24, L=2, r=6, q=1,
    10 rounds, recommendation_only against a pinned incorrect target, soft
    advocacy schedule (beta=4, threshold=0.5), b swept over 6/12/18 controlled
    positions (c = 0.25/0.5/0.75) across 20 tasks = 60 cells; 120 episodes at
    the 2 repetitions set here (smoke), 1800 at 30. One of three rows forming a
    3 x 3 (q_c, b) grid. cygnus variant: 20 tasks (was 2 matched worlds).
  tags: [relational, population-study-04, resource-grid, qc06, N24, q1, r6, soft-schedule, information, tasks20, cygnus]
  metadata:
    study: population_study_04
    design: sensing_actuation_resource_grid
    row: "q_c=6"
    population_rounds: 10
    social_group_size: 1
    support_redundancy: 6
    reasoning_depth: 2
    worlds: 20
    repetitions: 2   # smoke value; Cesar's row design is 30
    # The scientific coordinates of this row. `intervention_budget` and
    # `control_fraction` are swept, so they are listed as the swept sets rather
    # than as scalars; the per-cell values land in each cell's `overrides.json`
    # and on every round record.
    sensor_sample_size: 6
    sensing_fraction: 0.25
    intervention_budget_sweep: [6, 12, 18]
    control_fraction_sweep: [0.25, 0.5, 0.75]
    advocacy_schedule: soft
    policy_beta: 4.0
    policy_threshold: 0.5
    target_selection: fixed_option_index_2
    cells: 60
    episodes: 120          # 60 x 2; 1800 at 30 repetitions
    study_total_cells: 180
    study_total_episodes: 360   # 5400 at 30 repetitions
    base_config: ../population_study_03/relational_population_study03_g_stochastic_feedback_pilot.yaml

grid:
  # AXIS ORDER IS LOAD-BEARING. Cells are the cartesian product in declaration
  # order, so this ordering fixes cell-0000 = (b=6, task_0001) in all three
  # rows, which is what makes the shared seed a paired design. Do not reorder
  # in one file only.
  control.options.intervention_budget:
    - 6
    - 12
    - 18
  game.options.task_id:
    - task_0001
    - task_0002
    - task_0003
    - task_0004
    - task_0005
    - task_0007
    - task_0008
    - task_0009
    - task_0011
    - task_0012
    - task_0013
    - task_0014
    - task_0018
    - task_0021
    - task_0022
    - task_0023
    - task_0024
    - task_0027
    - task_0028
    - task_0030
