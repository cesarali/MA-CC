# Study 05 state-matched one-round intervention, world task_0001.
# This task-specific split is required because explicit votes are semantic
# relations and task_0001/task_0002 have different option alphabets.  Together
# with the task_0002 file this is one 120-episode experiment.

llm_provider:
  type: university
  model: gwdg/openai-gpt-oss-120b
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 8
  temperature: 0.0
  max_output_tokens: 4096
  options:
    estimated_latency_seconds: 10.0

prompt:
  schema_version: 2
  prompt_family: relational_public_ballot
  prompt_version: 1
  response_contract:
    type: relational_public_ballot
    allowed_values: [A, B, C]

game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 1
  topology: complete
  options:
    task_dataset_dir: src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r06
    task_id: task_0001
    dynamics_mode: reasoning
    rounds: 1
    social_group_size: 1
    vote_visibility: public
    prompt_version: 1
    social_distrust: true
    stop_on_consensus: false
    invalid_response_retries: 1
    expected_validation_failure_rate: 0.05
    initialization:
      mode: explicit
      # Base cell: n_Z(0)=6. The grid replaces this whole semantic vector.
      initial_votes: &votes6 [WEST, WEST, WEST, EAST, WEST, WEST, WEST, WEST, WEST, WEST, EAST, WEST, WEST, WEST, WEST, WEST, EAST, WEST, WEST, EAST, EAST, WEST, EAST, WEST]

control:
  mechanism: relational_round_budgeted
  options:
    target: 2                 # EAST, incorrect; resolved before vote validation
    sensor_sample_size: 18
    policy: soft_target
    threshold: 0.5
    beta: 4.0
    intervention_budget: 18
    advocacy_schedule: always
    message_mode: recommendation_only

execution:
  seed: 20260821
  repetitions: 10
  parallelism: 8
  fail_fast: false

pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false

budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 300.0
  max_cost_per_run: 300.0
  max_provider_requests: 3000
  max_input_tokens: 100000000
  max_output_tokens: 10000000
  allow_unbounded_paid_requests: false

logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    prompt_examples: {count: 1, scope: cell}

storage:
  output_dir: results
  format: jsonl
  artifact_profile: results_only
  checkpoint_mode: episode
  overwrite: false

# The standard information analysis is intentionally off: deterministic action
# cells have zero action entropy.  The study-specific script computes only the
# requested conditional means and matched chi contrast.
analysis:
  enabled: false

metrics:
  enabled: true
  comet_export: []

aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order, dominant_action_share]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0

observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 25
    sweep_experiment: true
    cell_reporting: master
    metric_plots: true

experiment:
  name: relational-study05-state-matching-task0001
  description: One-round matched initial-target-support intervention for task_0001.
  tags: [relational, population-study-05, state-matching, N24, one-round]
  metadata:
    study: population_study_05
    design: state_matched_intervention
    common_random_numbers_across_grid: true
    task_id: task_0001
    target_relation: EAST
    n_z_0: [6, 9, 12]
    action_arms: [always, never]
    repetitions: 10
    cells: 6
    episodes: 60

grid:
  game.options.initialization.initial_votes:
    - *votes6
    - &votes9 [WEST, EAST, WEST, EAST, WEST, WEST, WEST, WEST, WEST, EAST, EAST, WEST, EAST, WEST, WEST, WEST, EAST, WEST, WEST, EAST, EAST, WEST, EAST, WEST]
    - &votes12 [WEST, EAST, WEST, EAST, WEST, EAST, WEST, WEST, EAST, EAST, EAST, WEST, EAST, EAST, WEST, WEST, EAST, WEST, WEST, EAST, EAST, WEST, EAST, WEST]
  control.options.advocacy_schedule: [always, never]
