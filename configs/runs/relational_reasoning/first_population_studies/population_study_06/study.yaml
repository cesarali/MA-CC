study:
  name: relational-population-study-06

# The optional Qwen validation and anchor are deliberately excluded. See README.md:
# validation must pass before the anchor is eligible for submission.
configs:
  - study06_main_b_theta.yaml
  - study06_beta_ablation.yaml

execution:
  # Scientific cells are invariant; the scheduler distributes them as
  # independent execution shards and reconstructs them during aggregation.
  mode: auto
  target_rpm: 900
  assumed_latency_seconds: 10.0
  max_active_nodes: 18
  cpus_per_task: 8
  memory: 8G
  time_limit: "04:00:00"
  partition: all
  qos: normal
  results_root: /work/ojedamarin/Projects/LanguageGames/MA-CC/results/studies/relational_population_study_06
  require_results_under: /work/ojedamarin/Projects/LanguageGames/MA-CC/results

analysis:
  recipe: analysis.yaml
