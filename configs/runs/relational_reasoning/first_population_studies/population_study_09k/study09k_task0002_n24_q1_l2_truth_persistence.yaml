llm_provider:
  type: university
  model: gwdg/openai-gpt-oss-120b
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 10
  temperature: 0.0
  max_output_tokens: 4096
  options: {estimated_latency_seconds: 4.5}
prompt:
  schema_version: 2
  prompt_family: relational_public_ballot
  prompt_version: 1
  response_contract: {type: relational_public_ballot, allowed_values: [A, B, C]}
game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 30
  topology: complete
  options:
    task_dataset_dir: src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r06
    task_id: task_0002
    dynamics_mode: reasoning
    rounds: 30
    social_group_size: 1
    epistemic_persistence: 0.75
    vote_visibility: public
    prompt_version: 1
    receiver_epistemic_disposition: vigilant
    stop_on_consensus: false
    invalid_response_retries: 1
    expected_validation_failure_rate: 0.05
    initialization:
      mode: paired_local_vote
      artifact_dir: /work/ojedamarin/Projects/LanguageGames/MA-CC/results/studies/relational_population_study_09jk_initializations
      require_artifact: true
control:
  mechanism: relational_round_budgeted
  options:
    target: SOUTHWEST
    sensor_sample_size: 12
    policy: soft_target
    threshold: 0.75
    beta: 4.0
    intervention_budget: 6
    advocacy_schedule: soft
    message_mode: recommendation_plus_fact
    controller_evidence_strategy: strategic
execution: {seed: 20260831, repetitions: 20, parallelism: 10, fail_fast: false}
pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false
budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 600.0
  max_cost_per_run: 600.0
  max_provider_requests: 600000
  max_input_tokens: 1600000000
  max_output_tokens: 3000000000
  allow_unbounded_paid_requests: false
logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options: {comet_project: mas-cc, prompt_examples: {count: 1, scope: cell}}
storage: {output_dir: results, format: jsonl, artifact_profile: results_only, checkpoint_mode: episode, overwrite: false}
analysis: {enabled: false, estimators: []}
metrics: {enabled: true, comet_export: []}
aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order, dominant_action_share]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0
observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 1
    sweep_experiment: true
    cell_reporting: master
    metric_plots: true
experiment:
  name: relational-study09k-task0002-n24-q1-l2-truth-persistence
  description: >-
    High-statistics N=24, q=1, L=2 truth-target persistence successor to
    Study 09g in the deliberately changed vigilant_strategic epistemic class,
    with one natural LLM-generated initial state per repetition reused across
    every rho/b cell and the matched false-target Study 09j.
  tags: [relational, population-study-09k, N24, q1, L2, persistence, truth-target, vigilant-strategic, paired-initialization]
  metadata:
    study: population_study_09k
    matched_source: population_study_09g
    matched_counterpart: population_study_09j
    task_id: task_0002
    ground_truth: SOUTHWEST
    controller_target: SOUTHWEST
    controller_target_is_truth: true
    target_semantics: truth
    receiver_epistemic_disposition: vigilant
    controller_evidence_strategy: strategic
    epistemic_condition: vigilant_strategic
    message_mode: recommendation_plus_fact
    population_size: 24
    population_rounds: 30
    reasoning_depth: 2
    support_redundancy: 6
    support_coverage_fraction: 0.25
    reference_support_coverage_fraction: 0.3333333333333333
    social_group_size: 1
    sensor_sample_size: 12
    sensor_fraction: 0.5
    beta: 4.0
    theta: 0.75
    advocacy_schedule: soft
    repetitions: 20
    cells: 18
    episodes: 360
    late_time_rounds_one_based: [21, 30]
    common_random_numbers_across_grid: true
    paired_initialization_across_grid: true
    paired_initialization_across_targets: true
    paired_initialization_artifact_schema: 1
grid:
  game.options.epistemic_persistence: [0.75, 0.85, 1.00]
  control.options.intervention_budget: [6, 8, 12, 16, 18, 24]
