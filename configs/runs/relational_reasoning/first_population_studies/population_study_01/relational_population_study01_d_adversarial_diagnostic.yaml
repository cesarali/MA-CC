# Relational reasoning — first population experiment (study 01), arm D: adversarial social diagnostic
#
# Maximal social pressure toward a WRONG answer, with no factual injection.
# This is the arm that separates "the population reasoned" from "the population
# followed": under it m_ctrl and m_truth move in opposite directions.
#
# SHARED DESIGN (identical in all four arms)
#
#   N = 24 agents            L = 2 supporting facts        q = 1 social slot
#   K = 3 answer options     4 distractors                 10 population rounds
#   10 worlds x 3 repetitions per cell
#   no_single_agent_solution = true — nobody can answer alone at any r
#
# THE r AXIS
#
# `r` is how many agents initially hold each supporting fact. The four datasets
# are *matched*: for a given world, the world, question, supporting facts,
# distractors, correct relation and answer set are byte-identical across
# r = 1, 3, 6, 12, and only `agents[*].fact_ids` differs. That is checked
# programmatically by
# tests/mas_cc/test_relational_task_data.py::test_changing_r_changes_only_the_information_allocation
#
#   r =  1   each fact known by 1 of 24     18 agents start knowing nothing
#   r =  3   ...by 3                        15 agents start knowing nothing
#   r =  6   ...by 6                        11 agents start knowing nothing
#   r = 12   ...by 12                        0 agents start knowing nothing
#
# SEMANTIC VOTES
#
# The population state is the compass relation, not a letter. Every call gets
# its own seeded A/B/C shuffle and the returned letter is resolved back to the
# relation immediately, so a globally shared "vote B" attractor is impossible.
#
# WHAT TO READ AFTERWARDS — per round, from round_trajectory.jsonl:
#
#   kappa_t  mean_supporting_fact_coverage   (1/N) sum_i |K_i n S| / |S|
#   phi_t    full_proof_agent_share          (1/N) sum_i 1[S subset K_i]
#   p_truth  truth_vote_share
#   plus peer/controller exposures and acquisitions, and the full microscopic
#   trajectory in trajectory.jsonl.
#
# COST: 40 cells x 3 repetitions = 120 episodes,
#       264 provider calls each (24 initial votes + 24 x 10 focal updates)
#       = 31,680 calls for this arm.
#
# RUN FROM THE REPOSITORY ROOT — preflight first, it makes no model calls:
#
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment preflight \
#     --config configs/runs/relational_reasoning/population_study_01/relational_population_study01_d_adversarial_diagnostic.yaml \
#     --output-dir results/inspection/relational_study01_d_adversarial_diagnostic_preflight
#
#   conda run -n MA-CC --no-capture-output python -m mas_cc.cli.main experiment run \
#     --config configs/runs/relational_reasoning/population_study_01/relational_population_study01_d_adversarial_diagnostic.yaml

llm_provider:
  type: university
  model: gwdg/openai-gpt-oss-120b
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 8
  temperature: 0.0
  # gpt-oss is a reasoning model: `reasoning_content` and the answer are both
  # charged against max_tokens, and below roughly 1k the answer is truncated
  # away and `content` arrives empty. Not a cost dial - the budget guard settles
  # reservations against actual usage. Bound spend with budget.max_cost_per_run.
  max_output_tokens: 4096
  options:
    estimated_latency_seconds: 10.0

prompt:
  schema_version: 2
  prompt_family: relational_public_ballot
  prompt_version: 1
  response_contract:
    type: relational_public_ballot
    # The letters a call presents. Which relation each names is shuffled per
    # call; the population state is the relation, never the letter.
    allowed_values: [A, B, C]

game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 10
  topology: complete
  options:
    # Swept below; this is the r = 6 dataset, named so the config still loads
    # and preflights on its own.
    task_dataset_dir: src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r06
    task_id: task_0001
    dynamics_mode: reasoning
    rounds: 10
    social_group_size: 1
    vote_visibility: public
    prompt_version: 1
    social_distrust: true
    stop_on_consensus: false
    invalid_response_retries: 1
    expected_validation_failure_rate: 0.05
    initialization:
      # Each agent decides once from K_i(0) alone, so the starting population
      # reflects the distributed-information problem rather than a coin flip.
      mode: local_vote

control:
  mechanism: relational_round_budgeted
  options:
    # One wrong option, drawn uniformly from the episode seed and held for the
    # whole episode. The realized choice is recorded per round as
    # `controller_target` (and `analysis_target`).
    target: random_incorrect
    sensor_sample_size: 24
    policy: soft_target
    threshold: 0.5
    beta: 4.0
    # b/N = 1.0: at q = 1 every focal's only peer is the controller.
    intervention_budget: 24
    advocacy_schedule: always
    message_mode: recommendation_only
execution:
  seed: 20260818
  repetitions: 3
  parallelism: 8
  fail_fast: false

pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false

budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 300.0
  max_cost_per_run: 300.0
  max_provider_requests: 200000
  max_input_tokens: 1000000000
  max_output_tokens: 100000000
  allow_unbounded_paid_requests: false

logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    prompt_examples:
      count: 1
      scope: cell

storage:
  output_dir: results
  format: jsonl
  artifact_profile: full
  checkpoint_mode: episode
  overwrite: false

analysis:
  # Deliberately off. The configured estimators are HiddenBench-specific, and
  # this study's own analysis (kappa_t, phi_t, p_truth) is read straight off
  # round_trajectory.jsonl. No MI/CMI/TE yet.
  enabled: false

metrics:
  enabled: true
  comet_export: []

aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order, dominant_action_share]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0

observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 25
    sweep_experiment: true
    cell_reporting: master
    metric_plots: true

experiment:
  name: relational-study01-d-adversarial-diagnostic
  description: >-
    Relational reasoning population study 01, arm D: adversarial social diagnostic.
    N=24, L=2, q=1, 10 rounds, r in [1,3,6,12] over 10 matched worlds.
  tags: [relational, population-study-01, arm-d, N24, q1, r-sweep]
  metadata:
    study: population_study_01
    arm: "D"
    population_rounds: 10
    social_group_size: 1
    support_redundancies: [1, 3, 6, 12]

grid:
  game.options.task_dataset_dir:
    - src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r01
    - src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r03
    - src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r06
    - src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r12
  game.options.task_id:
    - task_0001
    - task_0002
    - task_0003
    - task_0004
    - task_0005
    - task_0006
    - task_0007
    - task_0008
    - task_0009
    - task_0010
