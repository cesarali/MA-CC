# Study 06 targeted beta ablation at theta=0.50.
# Shape: 3 b x 3 beta x 4 worlds x 10 repetitions = 360 episodes.
# Calls: 95,040 nominal; 100,440 expected; 190,080 conservative.

llm_provider:
  type: university
  model: gwdg/openai-gpt-oss-120b
  credentials_env: POTSDAM_API_KEY
  base_url_env: BASE_POTSDAM_LLM_URL
  timeout_seconds: 180
  max_retries: 2
  request_concurrency: 8
  temperature: 0.0
  max_output_tokens: 4096
  options: {estimated_latency_seconds: 10.0}

prompt:
  schema_version: 2
  prompt_family: relational_public_ballot
  prompt_version: 1
  response_contract: {type: relational_public_ballot, allowed_values: [A, B, C]}

game:
  type: relational_imitation_round_feedback
  population_size: 24
  horizon: 10
  topology: complete
  options:
    task_dataset_dir: src/mas_cc/relational_task_generator/relational_task_generator/datasets/pop24_L2_r06
    task_id: task_0001
    dynamics_mode: reasoning
    rounds: 10
    social_group_size: 1
    vote_visibility: public
    prompt_version: 1
    social_distrust: true
    stop_on_consensus: false
    invalid_response_retries: 1
    expected_validation_failure_rate: 0.05
    initialization: {mode: local_vote}

control:
  mechanism: relational_round_budgeted
  options:
    target: 2
    sensor_sample_size: 12
    policy: soft_target
    threshold: 0.50
    beta: 4.0
    intervention_budget: 16
    advocacy_schedule: soft
    message_mode: recommendation_only

execution:
  seed: 20260822
  repetitions: 10
  parallelism: 8
  fail_fast: false

pricing:
  mode: live
  max_age_seconds: 600
  require_fresh_at_launch: true
  fallback_policy: deny
  explicit_unknown_price_override: false

budget:
  accounting_unit: proxy_accounting_unit
  system_max_cost_per_run: 300.0
  max_cost_per_run: 300.0
  max_provider_requests: 220000
  max_input_tokens: 1500000000
  max_output_tokens: 200000000
  allow_unbounded_paid_requests: false

logging:
  level: INFO
  console: true
  audit: true
  comet: true
  options:
    comet_project: mas-cc
    prompt_examples: {count: 1, scope: cell}

storage:
  output_dir: results
  format: jsonl
  artifact_profile: results_only
  checkpoint_mode: episode
  overwrite: false

analysis: {enabled: false, estimators: []}
metrics: {enabled: true, comet_export: []}

aggregation:
  schema_version: 1
  forward_fill: absorbing
  relabel_by_winner: false
  percentiles: [10, 50, 90]
  rolling_window: 1
  cell_metrics: [m_ctrl, m_truth, m_order, dominant_action_share]
  sweep_metrics: []
  horizons: [1]
  null_permutations: 0

observability:
  schema_version: 1
  comet:
    writer: master_only
    heartbeat_seconds: 20
    progress_metrics: [episodes_done]
    grid_image_every_n_episodes: 25
    sweep_experiment: true
    cell_reporting: master
    metric_plots: true

experiment:
  name: relational-study06-beta-ablation
  description: >-
    Study 06 targeted beta x actuation ablation at theta=0.50, q_c=12 over
    four matched L2/r6 worlds and ten repetitions per cell.
  tags: [relational, population-study-06, beta-ablation, N24, q1, qc12, results-only]
  metadata:
    study: population_study_06
    phase: beta_ablation
    design: beta_b_sparse_ablation
    population_rounds: 10
    sensor_sample_size: 12
    policy_threshold: 0.50
    worlds: 4
    repetitions: 10
    cells: 36
    episodes: 360
    nominal_provider_requests: 95040
    expected_provider_requests: 100440
    conservative_provider_requests: 190080
    common_random_numbers_across_grid: false

grid:
  control.options.intervention_budget: [8, 16, 24]
  control.options.beta: [2.0, 4.0, 8.0]
  game.options.task_id: [task_0001, task_0002, task_0003, task_0004]
